<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Opportunities · Willow Bridge Canopy</title>
<link rel="icon" href="../shared/wb-mark.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
/* Willow Bridge B2B treatment.
   The satellite map is the slide and stays fully visible. Content sits on one hard-edged Cloud White
   panel instead of a full-height colored scrim. Willow Bridge Midnight carries the text; Willow Bridge
   Purple is reserved for small accents (rule, kickers, logo) so it never floods the page.
   Type is Aptos, the firm's working font, with Inter as the fallback where Aptos isn't installed. */
:root{
  color-scheme: light;
  --midnight:#1D1247;       /* WB Midnight: primary text */
  --purple:#432890;         /* WB Purple: accents only */
  --cloud:#FBFBF9;          /* Cloud White: panel and list ground */
  --lilac:#C7C9FE;          /* Lilac Mist: existing assets */
  --greentea:#CCECC3;       /* Green Tea: development land */
  --forest:#102930;         /* Forest Green: text on Green Tea */
  --breeze:#F9EEC4;         /* Summer Breeze: our take */
  --brick:#722525;          /* Brick Red: bid deadlines, passed */
  --sand:#C2B8AF;           /* Sand Grout: hairlines */
  --text:var(--midnight);
  --body:rgba(29,18,71,.86);
  --muted:rgba(29,18,71,.68);
  --faint:rgba(29,18,71,.45);
  --hair:rgba(29,18,71,.12);
  --font:Aptos, "Aptos Display", Inter, "Segoe UI", Arial, sans-serif;
  --display:"Aptos Display", Aptos, Inter, "Segoe UI", Arial, sans-serif;
  --panel:min(400px, calc(40vw - 20px));
  --gap:20px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0f0c1d;color:var(--text);font-family:var(--font);line-height:1.35;overflow:hidden;-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;background:#0f0c1d}
#scrim{display:none}
#veil{position:fixed;inset:0;pointer-events:none;background:#0f0c1d;opacity:0;transition:opacity 1.4s ease}
#veil.dim{opacity:.25}

/* the panel: fixed card, inner scroller, progress bar pinned at its foot */
#panel{position:fixed;left:var(--gap);top:var(--gap);max-height:calc(100% - var(--gap) * 2);width:var(--panel);
  background:var(--cloud);border-radius:10px;box-shadow:0 12px 40px rgba(10,6,30,.38),0 0 0 1px rgba(29,18,71,.06);
  display:flex;flex-direction:column;overflow:hidden}
#pscroll{flex:0 1 auto;min-height:0;overflow-y:auto;padding:26px 26px 18px;scrollbar-width:thin;scrollbar-color:rgba(29,18,71,.2) transparent}
#pfoot{flex:none;padding:12px 26px 16px;border-top:1px solid var(--hair);display:flex;align-items:center}
.slide{display:flex;flex-direction:column;gap:12px;opacity:0;transform:translateY(6px);transition:opacity .6s ease, transform .6s ease}
.slide.on{opacity:1;transform:none}
.brandrow{display:flex;align-items:center;gap:12px}
.brandrow img{width:28px;height:28px;flex:none;border-radius:3px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text);font-weight:600}
.eyebrow small{display:block;margin-top:3px;font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:400}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);font-weight:600}
h1{font-family:var(--display);font-weight:600;font-size:clamp(24px,2.1vw,30px);line-height:1.05;letter-spacing:-.01em;margin:10px 0 0;text-wrap:balance;color:var(--text)}
h1.cover{font-size:clamp(28px,2.6vw,36px);margin:6px 0 0}
.rule{width:40px;height:3px;background:var(--purple);border-radius:2px}
h2{font-family:var(--font);font-weight:400;font-size:15px;line-height:1.2;color:var(--muted);margin:0;text-wrap:balance}
h2.accent{font-family:var(--display);font-weight:600;color:var(--purple);font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--midnight);background:var(--lilac);padding:4px 8px;border-radius:3px}
.chip.land{background:var(--greentea);color:var(--forest)}
.chip.stage{background:none;color:var(--muted);box-shadow:inset 0 0 0 1px rgba(29,18,71,.22)}
.chip.stage.hot{color:var(--brick);box-shadow:inset 0 0 0 1px var(--brick)}
.chip.sample{background:var(--brick);color:var(--cloud)}

/* deal facts: label/value rows, numbers tabular */
.facts{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.3;color:var(--body)}
.facts .row{display:flex;flex-wrap:wrap;gap:3px 16px}
.facts b{font-weight:400;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;font-size:11px;margin-right:6px}
.facts span{font-variant-numeric:tabular-nums}
.facts .big{font-family:var(--display);font-size:19px;font-weight:600;color:var(--text)}
.facts .sub{color:var(--muted);font-size:13px}
.bid{color:var(--brick);font-size:13px;font-weight:600;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.badge{font-size:11px;letter-spacing:.1em;font-weight:600;color:var(--brick);box-shadow:inset 0 0 0 1px var(--brick);padding:2px 6px;border-radius:3px}
.badge.solid{background:var(--brick);color:var(--cloud)}
.request{font-size:13px;line-height:1.4;color:var(--body)}
.callout{background:var(--breeze);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.callout strong{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--midnight);font-weight:600}
.callout p{margin:0;font-size:13px;line-height:1.4;color:var(--midnight)}
.prev{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--hair);padding-top:10px}
.prev .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.prev div{font-size:12px;line-height:1.35;color:var(--body)}
.prev div em{font-style:normal;color:var(--purple);font-weight:600}
.outcome{border-radius:6px;box-shadow:inset 0 0 0 1px var(--hair);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.outcome .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.outcome .v{font-size:14px;font-weight:600}
.meta{font-size:12px;line-height:1.4;color:var(--faint)}
.meta a{color:var(--muted)} .meta a:hover{color:var(--purple)}

/* cover and market boards */
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.tally .grp{display:flex;flex-direction:column;gap:4px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--hair);padding:10px}
.tally .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;order:2}
.tally .n{display:flex;flex-direction:column;gap:2px;order:1}
.tally .n i{font-style:normal;font-family:var(--display);font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:var(--text)}
.tally .n span{display:none}
.due{display:flex;flex-direction:column}
.due div{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--body);border-bottom:1px solid var(--hair);padding:7px 0}
.due div em{font-style:normal;color:var(--text);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
ul.bul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--body)}
ul.bul li{padding-left:14px;position:relative}
ul.bul li::before{content:"";position:absolute;left:0;top:.5em;width:5px;height:5px;border-radius:50%;background:var(--purple)}
.lead{font-size:13px;color:var(--muted);line-height:1.4}

#bar{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
#bar button{width:16px;height:12px;padding:5px 0;border:0;background:none;cursor:pointer}
#bar button span{display:block;height:2px;background:rgba(29,18,71,.15);position:relative;overflow:hidden;border-radius:1px}
#bar button span i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--purple)}
#bar button:focus-visible, #ctl button:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

/* map controls: white pills, Midnight when active */
#ctl{position:fixed;right:var(--gap);bottom:var(--gap);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:55vw}
#ctl button{font:600 11px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--midnight);background:var(--cloud);border:0;box-shadow:0 4px 14px rgba(10,6,30,.3);padding:9px 13px;border-radius:6px;cursor:pointer}
#ctl button:hover{color:var(--purple)}
#ctl button[aria-pressed="true"]{background:var(--midnight);color:var(--cloud)}
#credit{position:fixed;right:var(--gap);top:12px;font-size:12px;color:rgba(255,255,255,.75);text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:right;pointer-events:none}
#err{position:fixed;right:var(--gap);top:36px;max-width:320px;font-size:12px;line-height:1.4;background:var(--cloud);color:var(--midnight);border-left:3px solid var(--brick);border-radius:4px;padding:10px 12px;box-shadow:0 4px 14px rgba(10,6,30,.3)}
#hint{position:fixed;left:calc(var(--panel) + var(--gap) * 2);right:var(--gap);margin:0 auto;top:var(--gap);max-width:520px;font-size:13px;line-height:1.4;background:var(--cloud);color:var(--midnight);border-radius:6px;padding:10px 14px;text-align:center;box-shadow:0 6px 20px rgba(10,6,30,.35)}
#hint textarea{display:block;width:100%;min-height:90px;margin-top:8px;font:11px/1.4 monospace}

.pin{width:18px;height:18px}   /* fixed-size marker box; MapLibre centers this on the coordinate */
.dot{box-sizing:border-box;width:18px;height:18px;border-radius:50%;background:var(--lilac);border:2px solid var(--midnight);box-shadow:0 0 0 3px rgba(199,201,254,.45);position:relative}
.dot::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--lilac);opacity:.7;animation:ping 2.2s ease-out infinite}
.dot.land{background:var(--greentea);box-shadow:0 0 0 3px rgba(204,236,195,.45)}
.dot.land::after{border-color:var(--greentea)}
.dot.arch{opacity:.5}.dot.arch::after{display:none}
@keyframes ping{from{transform:scale(.6);opacity:.8}to{transform:scale(2.1);opacity:0}}
.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{display:none}
[hidden]{display:none!important}

/* list view: full Cloud White page */
#list{position:fixed;inset:0;background:var(--cloud);color:var(--text);padding:36px 44px 90px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;z-index:2}
.lhead{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between}
.lhead h1{margin:0}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters button{font:600 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--midnight);background:none;border:0;box-shadow:inset 0 0 0 1px rgba(29,18,71,.2);padding:7px 11px;border-radius:6px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--midnight);color:var(--cloud);box-shadow:none}
.tw{overflow-x:auto}
#list table{border-collapse:collapse;width:100%;min-width:1000px;font-size:13px;line-height:1.3}
#list th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid rgba(29,18,71,.25);cursor:pointer;white-space:nowrap;user-select:none}
#list th[aria-sort]{color:var(--purple)}
#list td{padding:10px;border-bottom:1px solid var(--hair);vertical-align:top;color:var(--body)}
#list td b{font-weight:600;color:var(--text)}
#list td.num,#list th.num{text-align:right;font-variant-numeric:tabular-nums}
#list tr.r{cursor:pointer}
#list tr.r:hover td,#list tr.r:focus-visible td{background:rgba(67,40,144,.05)}
#list td small{display:block;color:var(--muted);font-size:12px}
#list td.st{max-width:28ch}
#list ~ #ctl{z-index:3}

@media (max-width:760px){
  :root{--panel:auto;--gap:10px}
  #panel{left:var(--gap);right:var(--gap);top:auto;bottom:var(--gap);max-height:56%;width:auto}
  #pscroll{padding:18px 16px 12px}
  #pfoot{padding:10px 16px 12px}
  #ctl{right:auto;left:var(--gap);bottom:auto;top:var(--gap);justify-content:flex-start;max-width:calc(100vw - 20px)}
  #ctl button{padding:7px 9px}
  #credit{display:none}
  #hint{left:var(--gap);top:auto;bottom:calc(56% + 20px)}
  #list{padding:60px 16px 60px}
  .tally{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .slide,#veil{transition:none}
  .dot::after{animation:none}
}

/* ---- deal card layout. Type scale: 11 caps labels · 13 body · 15 subtitle · 20 tile values · 26 headline.
   Spacing scale: 4 / 8 / 12 / 16 / 24. ---- */
.slide{gap:18px}
.dh{display:flex;flex-direction:column;gap:8px}
.dh h1{font-size:26px;margin:0}
.dh h2{font-size:15px}
.dh .chips{margin-top:2px}
.dh .to-scout{display:inline-block;margin-top:10px;font-size:13px;font-weight:500;color:var(--wb-purple,#432890);text-decoration:none}
.dh .to-scout:hover{text-decoration:underline}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--hair);border-radius:8px;overflow:hidden}
.tiles .tile{box-shadow:1px 1px 0 var(--hair)}   /* inner grid lines; the outer edge is clipped by the container */
.tile{background:var(--cloud);padding:10px 10px 11px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv small{font-size:12px;font-weight:600;color:var(--muted);margin-left:1px}
.tv{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.1;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.ts{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.sec{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--hair);padding-top:14px}
.sec h3{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--purple);font-weight:600}
.kv{display:grid;grid-template-columns:104px 1fr;gap:7px 12px;margin:0;font-size:13px;line-height:1.4}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--text)}
.kv dd .badge{margin-left:6px;vertical-align:1px}
.request{margin:0;font-size:13px;line-height:1.45;color:var(--body)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--body)}
.log li{display:grid;grid-template-columns:56px 1fr;gap:10px}
.log li span{color:var(--purple);font-weight:600;font-variant-numeric:tabular-nums}
.outcome .ov{font-size:14px;font-weight:600}
.meta{margin:0}

/* figures: one hero number, then a borderless two-column stat grid (replaces boxed tiles) */
.figures{display:flex;flex-direction:column;gap:14px}
.hero{display:flex;flex-direction:column;gap:3px}
.hv{font-family:var(--display);font-size:32px;font-weight:600;line-height:1;letter-spacing:-.01em;color:var(--text);font-variant-numeric:tabular-nums}
.hs{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px;padding-top:14px;border-top:1px solid var(--hair)}
.stat{display:flex;flex-direction:column;gap:3px;min-width:0}
/* valuation sensitivity: price on T-12 NOI at five going-in yields */
.sens{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.sens th,.sens td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--hair);white-space:nowrap}
.sens thead th{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;padding-top:2px}
.sens th:first-child,.sens td:first-child{text-align:left;padding-left:0;color:var(--muted);font-weight:400}
.sens .c{color:var(--text);font-weight:700}
.sens thead th.c{border-bottom:2px solid var(--text)}
.sens .pr td{font-size:14px;font-weight:600;color:var(--text)}
.sens .pr td.c{font-size:15px}
.sens-note{margin:8px 0 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat .tv{font-size:18px}

/* cover agenda */
.agenda{display:flex;flex-direction:column;margin-top:4px}
.ag-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:6px;border-bottom:1px solid rgba(29,18,71,.22)}
.ag-head span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);font-weight:600}
.ag-head em{font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ag-row{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:10px;width:100%;padding:9px 6px;margin:0 -6px;width:calc(100% + 12px);
  background:none;border:0;border-bottom:1px solid var(--hair);border-radius:4px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.ag-row:hover,.ag-row:focus-visible{background:rgba(67,40,144,.06);outline:none}
.ag-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.25;min-width:0}
.ag-name small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:1px}
.ag-px{font-family:var(--display);font-size:14px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.ag-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--lilac);box-shadow:0 0 0 1.5px var(--midnight)}
.ag-dot.land{background:var(--greentea)}
.ag-key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.ag-key span{display:inline-flex;align-items:center;gap:6px}

/* cover agenda: name · acres · guidance */
.agenda{display:flex;flex-direction:column;margin-top:6px}
.ag-row{display:grid;grid-template-columns:1fr 56px 78px;align-items:baseline;gap:12px;width:calc(100% + 12px);margin:0 -6px;padding:9px 6px;
  background:none;border:0;border-bottom:1px solid var(--hair);border-radius:4px;font:inherit;color:inherit;text-align:left;cursor:pointer}
button.ag-row:hover,button.ag-row:focus-visible{background:rgba(67,40,144,.06);outline:none}
.ag-head{cursor:default;padding-bottom:6px;border-bottom:1px solid rgba(29,18,71,.22);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ag-head span:first-child{color:var(--purple);font-size:11px;letter-spacing:.14em}
.ag-head span:not(:first-child){text-align:right}
.ag-name{font-size:14px;font-weight:600;color:var(--text);min-width:0}
.ag-num{text-align:right;font-size:13px;color:var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.ag-px{font-weight:600;color:var(--text)}

/* cover agenda: name · size · guidance */
.agenda{display:flex;flex-direction:column;margin-top:6px}
.ag-row{display:grid;grid-template-columns:1fr 72px 72px;align-items:baseline;gap:12px;width:calc(100% + 12px);margin:0 -6px;padding:9px 6px;
  background:none;border:0;border-bottom:1px solid var(--hair);border-radius:4px;font:inherit;color:inherit;text-align:left;cursor:pointer}
button.ag-row:hover,button.ag-row:focus-visible{background:rgba(67,40,144,.06);outline:none}
.ag-head{cursor:default;padding-bottom:6px;border-bottom:1px solid rgba(29,18,71,.22);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ag-head span:first-child{color:var(--purple);font-size:11px;letter-spacing:.14em}
.ag-head span:not(:first-child){text-align:right}
.ag-name{font-size:14px;font-weight:600;color:var(--text);min-width:0}
.ag-num{text-align:right;font-size:13px;color:var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.ag-px{font-weight:600;color:var(--text)}
/* v2: Willow Bridge Canopy house style (Aptos, neutral ground, hairlines); the player card keeps its layout */
:root{--font:Aptos,"Segoe UI Variable Text","Segoe UI",Inter,system-ui,sans-serif;--display:"Aptos Display",Aptos,"Segoe UI Variable Display","Segoe UI","Inter Display",Inter,sans-serif;--nav-h:48px}
body{overflow:hidden;font-feature-settings:"tnum" 1,"lnum" 1}
h1,h2.accent{font-family:var(--display)}
#panel *,#list *{text-transform:none !important;letter-spacing:normal !important}
#panel h1{letter-spacing:-.015em !important}
/* sit below the always-on top bar */
#map,#veil,#list{top:var(--nav-h)}
#panel{top:calc(var(--nav-h) + var(--gap));max-height:calc(100% - var(--nav-h) - var(--gap) * 2)}
#credit{top:calc(var(--nav-h) + 12px)}
#err{top:calc(var(--nav-h) + 36px)}
#hint{top:calc(var(--nav-h) + var(--gap))}
@media (max-width:760px){#panel{top:auto}#ctl{top:calc(var(--nav-h) + var(--gap))}}

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../shared/wb.js?v=202610271858"></script>
<script>
(async () => {
const { sb, user } = await WB.ready("pipeline");
/* ============================================================
   DATA. This block is the only thing that changes week to week.
   One record per deal. kind: "asset" (existing) or "land" (development).

   Common:  market ("Denver" | "Phoenix"), name, address, where, lat, lon, coord,
            parcels, parcelNote, broker, seller, owner (owner of record),
            guidance (number, $) or guidanceNote, units, acres, zoning,
            bidDate (call for offers, YYYY-MM-DD), stage, summary, take,
            log [[date, text]], outcome {result, buyer, price, date}, src [[label,url]]
   Asset:   yearBuilt, avgSf, units, effRentPsf/effRentMo, mktRentPsf/mktRentMo,
            newLeasePsf, occ (%), concessionWeeks, tradeNew / tradeRenew (net effective %), noi (T-12), adjNoi, proformaNoi,
            valueCap (our cap %, values T-12), lastSale {year, price, cap}, manager,
            developer, noiNote
   Land:    entitlement, doors (planned units for $/door), product,
            rentPsf / rentMo (today's market rent in our UW), roc (untrended
            return on cost %), reqRent ($/SF needed for a 6.50% YOC)

   stage: screening | underwriting | bidding | loi | contract | passed
   Archive rule: a deal archives once it has an outcome or its bid date has
   passed (unless we're in LOI or under contract). Passed deals stay on the board.
   ============================================================ */
/* ============================================================
   DATA: read live from Supabase (pipeline.deals, deal_log, deal_parcels, core.parcels).
   Each row is mapped to the deal shape the report below expects.
   ============================================================ */
const MKT = {denver: "Denver", phoenix: "Phoenix"};
/* The Thursday pipeline call: "new" means first seen since the last meeting (the most recent Thursday before today). */
const LAST_MEETING = (() => { const t = new Date(); const back = ((t.getDay() - 4 + 7) % 7) || 7; t.setDate(t.getDate() - back); return new Date(t.getTime() - t.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); })();
const isoToday = () => { const t = new Date(); return new Date(t.getTime() - t.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
function num(v){ return v == null || v === "" || isNaN(+v) ? null : +v; }
function ringsOf(geom){
  if(!geom) return [];
  if(geom.type === "Polygon") return [geom.coordinates];
  if(geom.type === "MultiPolygon") return geom.coordinates;
  return [];
}
function toDeal(r, logs, parcels){
  const u = r.uw || {};
  const yoc = r.uw_yoc != null ? num(r.uw_yoc) : u.roc != null ? num(u.roc) : (u.yieldOnCost != null ? (num(u.yieldOnCost) < 1 ? num(u.yieldOnCost) * 100 : num(u.yieldOnCost)) : null);
  const rentPsf = num(r.uw_rent_psf ?? u.rentPsf ?? u.uwRentsPerSF);
  const land = r.kind === "land";
  const stage = r.stage === "under_contract" ? "contract" : r.stage;
  const bidFuture = r.bid_date && r.bid_date >= isoToday();
  let outcome = null;
  if(r.stage === "lost") outcome = {result: "Lost", buyer: r.outcome_winner, price: num(r.outcome_price), date: r.outcome_date};
  else if(r.stage === "closed") outcome = {result: "Closed", buyer: r.outcome_winner || "Willow Bridge", price: num(r.outcome_price), date: r.outcome_date};
  else if(r.stage === "dead") outcome = {result: "Dead"};
  else if(r.stage === "passed" && !bidFuture) outcome = {result: "Passed"};
  return {
    id: r.id, property_id: r.property_id, _row: r,
    market: MKT[r.market_id] || r.market_id, kind: r.kind, name: r.name, address: r.address,
    where: u.where || u.submarket || null, lat: num(r.lat), lon: num(r.lng),
    broker: r.broker, seller: r.seller, owner: r.owner_of_record,
    guidance: num(r.guidance), guidanceNote: r.guidance_note,
    units: land ? null : num(r.units), doors: land ? num(u.doors ?? r.units) : null, acres: num(r.acres),
    zoning: r.zoning, entitlement: r.entitlement, bidDate: r.bid_date, stage, summary: r.summary, take: r.take,
    product: r.product_type || u.product || u.productType || null,
    rentPsf, rentMo: num(r.uw_rent_mo ?? u.rentMo) ?? (rentPsf && u.uwAvgUnitSize ? rentPsf * num(u.uwAvgUnitSize) : null),
    roc: yoc, reqRent: num(r.rent_for_target ?? u.reqRent),
    yearBuilt: num(r.year_built ?? u.yearBuilt), avgSf: num(r.avg_unit_sf ?? u.avgSf), occ: num(u.occ), concessionWeeks: num(u.concessionWeeks),
    effRentPsf: num(u.effRentPsf), effRentMo: num(u.effRentMo), mktRentPsf: num(u.mktRentPsf), mktRentMo: num(u.mktRentMo),
    newLeasePsf: num(u.newLeasePsf), tradeNew: num(u.tradeNew), tradeRenew: num(u.tradeRenew),
    goingIn: num(r.going_in_yield), bldgSf: num(r.building_sf),
    noi: num(u.noi), adjNoi: num(u.adjNoi), proformaNoi: num(u.proformaNoi), valueCap: num(u.valueCap),
    lastSale: u.lastSale || null, manager: u.manager || null, developer: u.developer || null, noiNote: u.noiNote || null,
    parcelNote: u.parcel_note || null, src: Array.isArray(u.sources) ? u.sources : null,
    log: (logs || []).map(l => [l.logged_on, l.body]),
    _parcels: parcels || [], checkBack: r.check_back_on, outcome,
    inScout: !!r.in_scout, firstSeen: r.first_seen, isNew: !!r.first_seen && r.first_seen >= LAST_MEETING, folder: r.folder_path || null,
  };
}
async function loadReport(){
  const since = new Date(Date.now() - 120 * 864e5).toISOString().slice(0, 10);
  const [rows, logs, links, parcels, trades, strip] = await Promise.all([
    WB.fetchAll("pipeline", "deals", "*", q => q.is("merged_into", null)),
    WB.fetchAll("pipeline", "deal_log", "id,deal_id,logged_on,kind,body", q => q.order("logged_on").order("id")),
    WB.fetchAll("pipeline", "deal_parcels", "deal_id,parcel_id"),
    WB.fetchAll("core", "parcels", "id,apn,geom"),
    WB.fetchAll("comps", "sale_comps", "id,market_id,name,city,sale_date,sale_price,units,year_built,price_per_unit,cap_rate,buyer,lat,lng,portfolio",
      q => q.eq("comp_type", "investment").gte("sale_date", since).is("excluded", null).order("sale_date", {ascending: false})).then(xs => xs.filter(c => (c.units == null || +c.units >= 100) && (c.year_built == null || +c.year_built >= 1970))),   /* same scope as Sale comps */
    WB.fetchAll("market", "strip_summary", "*").catch(() => []),
  ]);
  const pById = new Map(parcels.map(p => [p.id, p]));
  const byDeal = (arr, k) => arr.reduce((m, x) => (m.get(x[k]) || m.set(x[k], []).get(x[k])).push(x) && m, new Map());
  const L = byDeal(logs, "deal_id"), P = byDeal(links, "deal_id");
  const deals = rows.map(r => toDeal(r, L.get(r.id), (P.get(r.id) || []).flatMap(x => {
    const p = pById.get(x.parcel_id); if(!p) return [];
    return ringsOf(p.geom).map(rings => ({id: p.id, apn: p.apn, coords: rings}));
  })));
  return {market: "Southwest", title: "Opportunities", date: isoToday(), markets: ["Denver", "Phoenix"], deals,
    trades: trades.map(c => ({...c, market: MKT[c.market_id] || c.market_id, lat: num(c.lat), lon: num(c.lng)})),
    strip: Object.fromEntries((strip || []).map(x => [MKT[x.market_id] || x.market_id, x]))};
}
const REPORT = await loadReport();

/* ---------- light shell: the Midnight page band, the card and the map side by side ---------- */
(function shell(){
  /* sub-bar: Map and Deal log; Add a deal lives in the deal log, Fix parcel in each deal's settings */
  const band = WB.band({title: "Opportunities", tabs: '<button type="button" class="on" data-t="call" role="tab">Map</button><button type="button" data-t="list" role="tab">Deal log</button>'});
  const row = document.createElement("div"); row.className = "pctl";
  ["prev", "next"].forEach(id => { const b = document.getElementById(id); if(b) row.appendChild(b); });
  document.getElementById("pfoot").appendChild(row);
  band.querySelector(".tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-t]"); if(!b) return;
    const open = !document.getElementById("list").hidden;
    if((b.dataset.t === "list") !== open) document.getElementById("listb").click();
  });
  const setTop = () => { document.documentElement.style.setProperty("--top", Math.round(band.getBoundingClientRect().bottom) + "px"); if(window.__pmap) window.__pmap.resize(); };
  new ResizeObserver(setTop).observe(band); setTop(); addEventListener("resize", setTop);
})();

/* ---------- deal context: this deal against its submarket (Market Intel) and sales nearby (Sale Comps) ---------- */
const CTX = {};
function ctxBlock(d){
  if(d.lat == null || d.lon == null) return "";
  setTimeout(() => fillCtx(d), 0);
  return '<div class="dctx" data-ctx="' + d.id + '"><div class="none">Loading market context…</div></div>';
}
async function fillCtx(d){
  const el = () => document.querySelector('.dctx[data-ctx="' + d.id + '"]');
  if(!el()) return;
  if(!(d.id in CTX)){ const { data } = await sb.schema("pipeline").rpc("deal_context", {p_deal: d.id}); CTX[d.id] = data || null; }
  const c = CTX[d.id], box = el(); if(!box) return;
  if(!c){ box.innerHTML = '<div class="none">No market data near this deal yet.</div>'; return; }
  const e = WB.esc, st = c.stats || {}, ours = d.rentPsf || d.effRentPsf || null;
  const pct = (a, b) => a && b ? '<span class="d ' + (a >= b ? "pos" : "neg") + '">' + (a >= b ? "+" : "") + ((a / b - 1) * 100).toFixed(1) + "%</span>" : '<span class="d"></span>';
  const row = (l, v, d2) => '<span>' + l + '</span><span class="v">' + v + "</span>" + (d2 || '<span class="d"></span>');
  const mkt = e(d._row.market_id);
  let html;
  const cs = c.comp_set;
  if(cs){
    /* a saved comp set tied to this deal (built in Market Intel) replaces the automatic submarket read */
    const s2 = cs.stats || {}, mem = cs.members || [], n = mem.length;
    const oAsk = d.mktRentPsf || d.rentPsf || null, oEff = d.effRentPsf || null, oMo = d.mktRentMo || d.rentMo || null;
    const pts = (a, b) => a != null && b != null ? '<span class="d ' + (a >= b ? "pos" : "neg") + '">' + (a >= b ? "+" : "") + (a - b).toFixed(1) + " pts</span>" : '<span class="d"></span>';
    const wk = (a, b) => a != null && b != null ? '<span class="d">' + (+a).toFixed(1) + " wks</span>" : '<span class="d"></span>';
    const anyOurs = oAsk || oEff || oMo || d.occ != null || d.concessionWeeks != null;
    html = '<h3>Against the ' + e(cs.name) + ' comp set (' + n + (n === 1 ? " property" : " properties") + ') <a href="../intel/?market=' + mkt + "&compset=" + e(cs.id) + '">Edit in Market Intel</a></h3>'
      + (n ? '<div class="cmp">' + (anyOurs ? '<span class="h"></span><span class="h">Set</span><span class="h d">Ours vs.</span>' : "")
        + (s2.rent_psf != null ? row("Asking rent / SF", "$" + (+s2.rent_psf).toFixed(2), pct(oAsk, +s2.rent_psf)) : "")
        + (s2.eff_psf != null ? row("Effective rent / SF", "$" + (+s2.eff_psf).toFixed(2), pct(oEff, +s2.eff_psf)) : "")
        + (s2.rent_mo != null ? row("Asking rent / month", "$" + Math.round(+s2.rent_mo).toLocaleString("en-US"), pct(oMo, +s2.rent_mo)) : "")
        + (s2.occupancy_pct != null ? row("Occupancy", (+s2.occupancy_pct).toFixed(1) + "%", pts(d.occ, +s2.occupancy_pct)) : "")
        + (s2.concession_weeks != null ? row("Concessions", (+s2.concession_weeks).toFixed(1) + " wks free", wk(d.concessionWeeks, s2.concession_weeks)) : "")
        + "</div>"
        + '<div class="csm">' + mem.slice(0, 8).map(m => '<div class="csm-r"><span class="csm-n"><b>' + e(m.name || m.address || "Property") + "</b><br><span>" + [m.year_built, m.units ? (+m.units).toLocaleString("en-US") + " units" : "", m.miles != null ? m.miles + " mi" : ""].filter(Boolean).join(", ")

/* "Set location on the map": the next click on the map fills Latitude / Longitude (saved with the rest of the form). */
let pinBox = null, pinHooked = false;
function hookPin(){
  if(pinHooked || !map) return; pinHooked = true;
  map.on("click", (e) => {
    if(!pinBox) return;
    const box = pinBox; pinBox = null; map.getCanvas().style.cursor = "";
    box.querySelector("[name=lat]").value = e.lngLat.lat.toFixed(6);
    box.querySelector("[name=lng]").value = e.lngLat.lng.toFixed(6);

document.addEventListener("click", async (ev) => {
  const box = ev.target.closest(".mg[data-deal]"); if(!box) return;
  if(ev.target.closest("[data-fixparcel]")){ document.getElementById("pick").click(); return; }
  if(ev.target.closest("[data-pin]")){
    if(!map){ box.querySelector(".pinmsg").textContent = "The map isn't loaded."; return; }
    if(picking) setPick(false);
    setPlaying(false); hookPin(); pinBox = box; map.getCanvas().style.cursor = "crosshair";
    box.querySelector(".pinmsg").textContent = "Click the map where the deal is…";
    hint.hidden = false; hint.textContent = "Click the map to place this deal. Drag and zoom first if you need to.";
    return;
  }
  const cb = ev.target.closest("[data-cb]");
  if(cb){
    const t = new Date(); t.setMonth(t.getMonth() + +cb.dataset.cb);
    box.querySelector("[name=check_back_on]").value = t.toISOString().slice(0, 10);
    const st = box.querySelector("[name=stage]"); if(!["lost","dead","closed","passed"].includes(st.value)) st.value = "monitor";
    return;
  }
  if(!ev.target.closest("[data-save]")) return;
  const d = REPORT.deals.find(x => x.id === box.dataset.deal); if(!d) return;
  const f = n => (box.querySelector("[name=" + n + "]").value || "").trim();
  const newStage = f("stage"), dbStage = newStage === "contract" ? "under_contract" : newStage;
  const num = n => f(n) === "" ? null : +f(n);
  const det = {name: f("name") || d._row.name, address: f("address") || null, kind: f("kind"), market_id: f("market_id"),
    units: num("units") == null ? null : Math.round(num("units")), acres: num("acres"), lat: num("lat"), lng: num("lng"),
    broker: f("broker") || null, seller: f("seller") || null, first_seen: f("first_seen") || d._row.first_seen, guidance_note: f("guidance_note") || null,
    folder_path: f("folder_path") || null, summary: f("summary") || null, take: f("take") || null};
  if((det.lat == null) !== (det.lng == null)){ box.querySelector(".saved").textContent = "Enter both latitude and longitude, or neither."; return; }
  const moved = det.lat !== (d._row.lat == null ? null : +d._row.lat) || det.lng !== (d._row.lng == null ? null : +d._row.lng);
  const patch = {...det, stage: dbStage, bid_date: f("bid_date") || null, guidance: f("guidance") === "" ? null : +f("guidance"),
    check_back_on: f("check_back_on") || null, outcome_winner: f("outcome_winner") || null,
    outcome_price: f("outcome_price") === "" ? null : +f("outcome_price")};
  if(["lost","closed"].includes(dbStage) && !d._row.outcome_date) patch.outcome_date = isoToday();
  const msg = box.querySelector(".saved"); msg.textContent = "Saving…";
  const prevStage = d._row.stage, prevLabel = STAGES[d.stage] || d.stage;
  const { data: row, error } = await sb.schema("pipeline").from("deals").update(patch).eq("id", d.id).select().single();
  if(error){ msg.textContent = error.message; return; }
  const notes = [];
  if(prevStage !== dbStage) notes.push({deal_id: d.id, kind: "stage", body: "Stage: " + prevLabel + " → " + (STAGES[newStage] || newStage) + (patch.check_back_on ? ", check back " + fmtDate(patch.check_back_on) : "") + "."});
  if(moved && det.lat != null) notes.push({deal_id: d.id, kind: "note", body: "Location updated."});
  if(f("note")) notes.push({deal_id: d.id, kind: "note", body: f("note")});
  if(notes.length){ const { error: e2 } = await sb.schema("pipeline").from("deal_log").insert(notes); if(e2){ msg.textContent = e2.message; return; } }
  const log = d.log.concat(notes.map(n => [isoToday(), n.body]));
  Object.assign(d, toDeal(row, [], d._parcels), {log});
  repaintDeal();
  WB.toast("Saved");
});

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function fmtDate(iso){ if(!iso) return ""; const [y,m,d] = iso.split("-").map(Number); return MONTHS[m-1] + " " + d + ", " + y; }
function shortDate(iso){ if(!iso) return ""; const [,m,d] = iso.split("-").map(Number); return MONTHS[m-1].slice(0,3) + " " + d; }
function fmtNum(n){ return n.toLocaleString("en-US", {maximumFractionDigits: n < 10 ? 2 : (n < 100 ? 1 : 0)}); }
function usd(n){ return "$" + Math.round(n).toLocaleString("en-US"); }
function usdM(n){ return n >= 1e6 ? "$" + (n/1e6).toFixed(n >= 1e8 ? 0 : 1) + "M" : usd(n); }
function today(){ const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function daysTo(iso){ if(!iso) return null; const [y,m,d] = iso.split("-").map(Number); return Math.round((new Date(y, m-1, d) - today()) / 864e5); }
const STAGES = {prospect:"Prospect", screening:"Screening", underwriting:"Underwriting", bidding:"Bidding", loi:"LOI", contract:"Under contract", monitor:"Monitor", passed:"Passed", lost:"Lost", dead:"Dead", closed:"Closed"};
const DB_STAGE = {contract:"under_contract"};
function watching(d){ return d.stage === "prospect" || d.stage === "monitor"; }
const HOT = new Set(["bidding","loi","contract"]);
function archived(d){
  if(d.outcome) return true;
  if(["lost","dead","closed"].includes(d.stage)) return true;   /* passed deals stay on the board until they trade or their bid date passes */
  const n = daysTo(d.bidDate);
  return n != null && n < 0 && !["loi","contract"].includes(d.stage);
}
/* derived metrics */
function ppu(d){ return (d.guidance && d.units) ? d.guidance / d.units : null; }
function ppsf(d){ return (d.guidance && d.units && d.avgSf) ? d.guidance / (d.units * d.avgSf) : null; }
function ppa(d){ return (d.guidance && d.acres) ? d.guidance / d.acres : null; }
function ppland(d){ return (d.guidance && d.acres) ? d.guidance / (d.acres * 43560) : null; }
function ppd(d){ return (d.guidance && d.doors) ? d.guidance / d.doors : null; }
function density(d){ const u = d.kind === "land" ? d.doors : d.units; return (u && d.acres) ? u / d.acres : null; }
function priceLine(d){ return d.guidance ? usdM(d.guidance) : "Unpriced"; }   /* the guidance note shows under the figure on the slide, never in the cover table */
function bidBadge(d){
  if(d.outcome) return '<span class="badge">' + esc(d.outcome.result || "Closed") + '</span>';
  const n = daysTo(d.bidDate); if(n == null) return "";
  if(n < 0) return '<span class="badge">PAST</span>';
  if(n === 0) return '<span class="badge solid">DUE TODAY</span>';
  return '<span class="badge' + (n <= 7 ? " solid" : "") + '">IN ' + n + ' DAY' + (n === 1 ? "" : "S") + '</span>';
}

/* ---------- parcels (same source and point lookup as Site Scout) ---------- */
const PARCEL_SVC = "https://gis.colorado.gov/public/rest/services/Address_and_Parcel/Colorado_Public_Parcels/FeatureServer/0";
const OV_KEY = "wb_dealreport_parcel_fixes";
let OV = {};
try{ OV = JSON.parse(localStorage.getItem(OV_KEY) || "{}") || {}; }catch(e){ OV = {}; }
function saveOV(){ try{ localStorage.setItem(OV_KEY, JSON.stringify(OV)); }catch(e){} }
function decodeRing(a){ const x0 = a[0], y0 = a[1], o = [[x0/1e5, y0/1e5]]; for(let i = 2; i < a.length; i += 2) o.push([(x0 + a[i])/1e5, (y0 + a[i+1])/1e5]); return o; }
function slug(d){ return d.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
function getParcels(d){ return d._parcels || []; }
function ringAcres(r){ const k = Math.cos(r[0][1] * Math.PI/180) * 111320; let s = 0; for(let i = 0; i < r.length - 1; i++) s += (r[i][0]*k) * (r[i+1][1]*110950) - (r[i+1][0]*k) * (r[i][1]*110950); return s / 2 / 4046.86; }
function parcelAcres(ps){ return ps.reduce((t, p) => t + Math.abs(p.coords.reduce((a, r) => a + ringAcres(r), 0)), 0); }
function squareFor(d, scale){
  const acres = d.acres || 4, half = Math.sqrt(acres * 4046.86) / 2 * (scale || 1);
  const dLat = half / 111320, dLon = half / (111320 * Math.cos(d.lat * Math.PI / 180));
  return [[d.lon - dLon, d.lat - dLat],[d.lon + dLon, d.lat - dLat],[d.lon + dLon, d.lat + dLat],[d.lon - dLon, d.lat + dLat],[d.lon - dLon, d.lat - dLat]];
}
function jsonp(url, params){
  return new Promise((ok, no) => {
    const cb = "_pcb" + Math.random().toString(36).slice(2), sc = document.createElement("script");
    const done = () => { delete window[cb]; sc.remove(); };
    window[cb] = j => { done(); ok(j); };
    sc.onerror = () => { done(); no(new Error("jsonp")); };
    params.set("callback", cb); sc.src = url + "?" + params; document.head.appendChild(sc);
  });
}
const COUNTY_SVC = [

function pick(a, names){ for(const n of names) for(const k in a) if(k.toLowerCase() === n.toLowerCase() && a[k] != null && a[k] !== "") return String(a[k]); return ""; }
function timeout(ms){ return new Promise((_, no) => setTimeout(() => no(new Error("timeout")), ms)); }
async function queryPoint(svc, lng, lat, fields){
  const mk = () => new URLSearchParams({geometry:JSON.stringify({x:lng, y:lat, spatialReference:{wkid:4326}}), geometryType:"esriGeometryPoint",
    inSR:4326, outSR:4326, spatialRel:"esriSpatialRelIntersects", outFields:fields, returnGeometry:true, geometryPrecision:6, resultRecordCount:1, f:"json"});
  const viaFetch = fetch(svc + "/query?" + mk()).then(r => r.json());
  const viaJsonp = viaFetch.catch(() => jsonp(svc + "/query", mk()));
  const j = await Promise.race([viaJsonp, timeout(30000)]);
  if(j && j.error) throw new Error(j.error.message || "service error");
  const f = j && j.features && j.features[0];
  if(!f || !f.geometry || !f.geometry.rings) return null;
  const a = f.attributes || {};
  return {apn:pick(a, ["parcel_id","APN_DASH","PARCELNB","PIN","SCHEDNUM","SCHEDULE","PARCEL_NO","PARCELNO","APN","ACCOUNT_NO","ACCOUNTNO","STATE_PARCEL_NO"]),
          situs:pick(a, ["situsAdd","PHYSICAL_ADDRESS","CONCATADDR1","SITUS","SITUS_ADDRESS","SITEADDRESS","SITE_ADDRESS","PROP_ADDR","PROPERTY_ADDRESS","ADDRESS","LOCATION"]),
          coords:f.geometry.rings};
}
/* Maricopa County Assessor, for Phoenix deals (same service Site Scout uses) */
const MARICOPA_SVC = "https://gis.mcassessor.maricopa.gov/arcgis/rest/services/MaricopaDynamicQueryService/MapServer/3";
async function parcelAt(lng, lat){
  if(lat < 36){
    const v = await queryPoint(MARICOPA_SVC, lng, lat, "APN_DASH,PHYSICAL_ADDRESS,OWNER_NAME");
    return v;
  }
  const tries = [queryPoint(PARCEL_SVC, lng, lat, "parcel_id,situsAdd,owner,countyName")];
  COUNTY_SVC.forEach(c => { if(lat >= c.b[0] && lat <= c.b[2] && lng >= c.b[1] && lng <= c.b[3]) tries.push(queryPoint(c.svc, lng, lat, "*")); });
  const hits = tries.map(t => t.then(v => v || Promise.reject(new Error("none"))));
  try{ return await Promise.any(hits); }
  catch(e){
    const res = await Promise.allSettled(tries);
    if(res.some(r => r.status === "fulfilled")) return null;
    throw new Error("unreachable");
  }
}

}

function sensTable(d){
  const noi = d.noi, y = d.goingIn != null ? d.goingIn : d.valueCap;

  const sf = d.bldgSf || (d.units && d.avgSf ? d.units * d.avgSf : null);

  const pc = n => { const p = (n / d.guidance - 1) * 100; return (p >= 0 ? "+" : "−") + Math.abs(p).toFixed(1) + "%"; };
  return '<table class="sens"><thead><tr><th>Going-in yield</th>' + ys.map(v => "<th" + c(v) + ">" + v.toFixed(2) + "%</th>").join("") + "</tr></thead><tbody>"
    + row("pr", "Price", n => usdM(n))
    + (d.units ? row("", "Per unit", n => usdK(n / d.units)) : "")
    + (sf ? row("", "Per SF", n => "$" + Math.round(n / sf)) : "")

  return head(d)
    + '<header class="dh"><h1>' + esc(d.name) + "</h1><h2>" + esc(d.where || d.address || "") + "</h2>"
    + '<div class="chips"><span class="chip' + (isLand ? " land" : "") + '">' + (isLand ? "Development" : "Investment") + "</span>"

    + (d.isNew ? '<span class="chip new">New this week</span>' : "") + (d.sample ? '<span class="chip sample">Sample</span>' : "") + "</div>"
    + (d.id && !d.sample ? '<a class="to-scout" href="../scout/?deal=' + encodeURIComponent(d.id) + '">Open in Site Scout →</a>' : "") + "</header>"
    + '<div class="figures">' + strip + "</div>"

    + (d.take ? '<div class="callout"><strong>Our take</strong><p>' + esc(d.take) + "</p></div>" : "")
    + outcome
    + section("Site", site)

    + section("Notes", (d.summary ? '<p class="request">' + esc(d.summary) + "</p>" : "") + (d.noiNote ? '<p class="request">' + esc(d.noiNote) + "</p>" : ""))
    + section("Deal log", log)

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const narrow = () => innerWidth <= 760;
function pad(){
  return narrow() ? {top:60, left:30, right:30, bottom:Math.round(innerHeight * 0.58) + 10}

let map = null, markers = [];
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
function initMap(){

  map = window.__pmap = new maplibregl.Map({
    container:"map", attributionControl:false, interactive:true, fadeDuration:300,
    style:{ version:8,
      sources:{
        img:{type:"raster", tiles:[ESRI + "World_Imagery/MapServer/tile/{z}/{y}/{x}"], tileSize:256, maxzoom:19},
        ref:{type:"raster", tiles:[ESRI + "Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}"], tileSize:256, maxzoom:19},
        site:{type:"geojson", data:{type:"FeatureCollection", features:[]}}
      },
      layers:[
        {id:"img", type:"raster", source:"img", paint:{"raster-brightness-max":0.86, "raster-saturation":-0.12, "raster-fade-duration":500}},
        {id:"ref", type:"raster", source:"ref", paint:{"raster-opacity":0.55}},
        {id:"site-fill", type:"fill", source:"site", paint:{"fill-color":["match",["get","kind"],"land","#CCECC3","#C7C9FE"], "fill-opacity":0.2}},
        {id:"site-case", type:"line", source:"site", paint:{"line-color":"#1D1247", "line-width":5.5, "line-opacity":0.55}},
        {id:"site-line", type:"line", source:"site", paint:{"line-color":["match",["get","kind"],"land","#CCECC3","#C7C9FE"], "line-width":2.75}}
      ]},
    center:[-104.99, 39.74], zoom:9
  });
  map.on("error", e => { if(e && e.sourceId === "img") fail("Satellite imagery is not loading. The slides still run; check the network connection."); });
  map.on("click", onMapClick);
  map.on("load", () => { if(ready){ camera(SLIDES[idx]); return; } ready = true; go(START); if(!START) loop(); });
  setTimeout(() => { if(!ready){ ready = true; go(START); if(!START) loop(); } }, 4000);
}
function fail(msg){ const e = $("#err"); e.textContent = msg; e.hidden = false; if(!ready){ ready = true; go(START); if(!START) loop(); } }
function clearMarkers(){ markers.forEach(m => m.remove()); markers = []; }
function addMarker(d, dim){
  if(!map || d.lat == null || d.lon == null) return;
  /* MapLibre positions the wrapper with its own absolute positioning and transforms. The styled dot lives
     inside it, so our CSS (position, border, pulse) can never shift where the marker sits on zoom. */
  const el = document.createElement("div"); el.className = "pin";
  const dot = document.createElement("div"); dot.className = "dot" + (d.kind === "land" ? " land" : "") + (dim ? " arch" : "");
  el.appendChild(dot);
  el.title = d.name + (dim ? " (" + (d.outcome ? d.outcome.result : (STAGES[d.stage] || d.stage)) + ")" : "");
  el.style.cursor = "pointer";
  el.addEventListener("click", ev => { ev.stopPropagation(); const i = SLIDES.findIndex(x => x.d === d); if(i >= 0){ setPlaying(false); go(i); } });
  markers.push(new maplibregl.Marker({element:el, anchor:"center"}).setLngLat([d.lon, d.lat]).addTo(map));
}
function allBounds(list){
  const b = new maplibregl.LngLatBounds();
  const pts = list.filter(d => d.lat != null && d.lon != null);
  const c = WB.marketCenter(WB.getMarket() !== "all" ? WB.getMarket() : (WB.markets[0] || {}).id) || [39.74, -104.99];
  (pts.length ? pts : [{lon:c[1], lat:c[0]}]).forEach(d => b.extend([d.lon, d.lat])); return b;
}
function camera(s){
  if(!map || !map.getSource("site")) return;
  const move = (fn, o) => reduce ? map.jumpTo(map.cameraForBounds(o.bounds, {padding:o.padding, maxZoom:o.maxZoom})) : fn();
  clearMarkers();
  map.getSource("site").setData({type:"FeatureCollection", features:[]});
  $("#veil").classList.toggle("dim", s.t !== "deal");
  if(s.t === "sales"){
    const pts = salesFor(s.m).list.filter(c => c.lat != null && c.lon != null);
    const o = {bounds:allBounds(pts.length ? pts : active.filter(d => d.market === s.m)), padding:pad(), maxZoom:12};
    move(() => map.fitBounds(o.bounds, {padding:o.padding, maxZoom:o.maxZoom, duration:3200, essential:true}), o);
    pts.forEach(c => addMarker({lat:c.lat, lon:c.lon, kind:"asset"}, false));
    return;
  }
  if(s.t === "cover" || s.t === "market"){
    const list = s.t === "market" ? active.filter(d => d.market === s.m) : active;
    const o = {bounds:allBounds(list), padding:pad(), maxZoom:11};
    move(() => map.fitBounds(o.bounds, {padding:o.padding, maxZoom:o.maxZoom, duration:3200, essential:true}), o);
    arch.filter(d => s.t !== "market" || d.market === s.m).forEach(d => addMarker(d, true));
    list.forEach(d => addMarker(d));
    return;
  }
  const d = s.d, ps = getParcels(d);
  let b;
  if(ps.length){
    let w = 180, e = -180, so = 90, n = -90;
    ps.forEach(p => p.coords.forEach(r => r.forEach(q => { w = Math.min(w, q[0]); e = Math.max(e, q[0]); so = Math.min(so, q[1]); n = Math.max(n, q[1]); })));
    const mx = Math.max((e - w) * 0.75, 0.0006), my = Math.max((n - so) * 0.75, 0.0005);
    b = new maplibregl.LngLatBounds([w - mx, so - my], [e + mx, n + my]);

  } else {
    const frame = squareFor(d, 5); b = new maplibregl.LngLatBounds(frame[0], frame[2]);
  }
  const o = {bounds:b, padding:pad(), maxZoom:ps.length ? 17.6 : 15.6};
  if(!s.keep) move(() => map.fitBounds(b, {padding:o.padding, maxZoom:o.maxZoom, duration:5200, curve:1.5, essential:true}), o);
  drawSite(d);
}
function drawSite(d){
  if(!map || !map.getSource("site")) return;

  map.getSource("site").setData({type:"FeatureCollection", features:ps.map(p => ({type:"Feature", properties:{apn:p.apn, kind:d.kind}, geometry:{type:"Polygon", coordinates:p.coords}}))});
  if(!ps.length) addMarker(d, archived(d));

function saleHtml(d, r){
  const e = WB.esc, today = isoToday();
  const inp = (n, l, t, v, extra) => '<label><span>' + l + '</span><input name="' + n + '" type="' + t + '"' + (t === "number" ? ' step="any"' : "") + ' value="' + e(v == null ? "" : v) + '"' + (extra || "") + "></label>";

      : "When it trades, record the sale here. It adds a sale comp on this property and works out the cap rate on the marketed T-12.") + "</p>"
    + '<div class="grid">'
    + inp("rs_price", "Sale price ($)", "number", r.outcome_price) + inp("rs_date", "Sale date", "date", r.outcome_date, ' max="' + today + '"') + inp("rs_buyer", "Buyer", "text", r.outcome_winner)
    + inp("rs_seller", "Seller", "text", r.seller) + inp("rs_cap", "Reported cap rate (%)", "number", null) + inp("rs_noi", "T-12 NOI ($)", "number", (r.uw || {}).noi)
    + '<label class="ck"><input type="checkbox" name="rs_ours"' + (r.stage === "closed" ? " checked" : "") + "> We bought it</label>"
    + '<div class="sale-cap" id="saleCap" aria-live="polite"></div>'
    + '<div class="sale-act"><button type="button" class="btn" id="saleGo">' + (r.outcome_date ? "Update sale" : "Record sale") + "</button></div>"
    + "</div></fieldset>";
}
function wireSale(m, d, r){
  const box = m.querySelector("#saleBox"); if(!box) return;
  const f = n => box.querySelector('[name="' + n + '"]');
  const capLine = () => {
    const p = +f("rs_price").value, noi = +f("rs_noi").value, u = N(r.units);
    const bits = [];
    if(p && noi) bits.push((noi / p * 100).toFixed(2) + "% cap on the marketed T-12");
    if(p && u) bits.push(WB.fmt.usdFull(p / u) + " per unit");
    box.querySelector("#saleCap").textContent = bits.join(" · ");
  };
  box.addEventListener("input", capLine);
  box.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.tagName === "INPUT"){ e.preventDefault(); box.querySelector("#saleGo").click(); } });
  /* prefill from the comp already on this deal, and the seller from the property's owner on record */
  const pid = r.property_id || d.property_id;
  Promise.all([
    sb.schema("comps").from("sale_comps").select("id,sale_date,sale_price,buyer,seller,cap_rate,cap_rate_t12,t12_noi").eq("deal_id", d.id).maybeSingle(),
    pid ? sb.schema("core").from("properties").select("owner").eq("id", pid).maybeSingle() : Promise.resolve({data: null}),
  ]).then(([c, p]) => {
    if(!m.contains(box)) return;
    const comp = c && c.data, owner = p && p.data && p.data.owner;
    if(!f("rs_seller").value && owner) f("rs_seller").value = owner;
    if(comp){
      if(comp.sale_price != null) f("rs_price").value = comp.sale_price;
      if(comp.sale_date) f("rs_date").value = comp.sale_date;
      if(comp.buyer) f("rs_buyer").value = comp.buyer;
      if(comp.seller) f("rs_seller").value = comp.seller;
      if(comp.cap_rate != null) f("rs_cap").value = comp.cap_rate;
      if(comp.t12_noi != null) f("rs_noi").value = comp.t12_noi;
      box.querySelector("#saleLead").innerHTML = "Sale recorded " + esc(WB.fmt.date(comp.sale_date)) + '. <a href="' + WB.ROOT + "comps/?comp=" + comp.id + '">Open the sale comp</a>. Change a figure and update it here.';
      box.querySelector("#saleGo").textContent = "Update sale";
    }
    capLine();
  });
  capLine();
  box.querySelector("#saleGo").onclick = async () => {
    const msg = m.querySelector(".msg"), price = f("rs_price").value === "" ? null : +f("rs_price").value, date = f("rs_date").value || null;
    if(!price || !date){ msg.textContent = "A sale needs a price and a date."; return; }
    const num = n => f(n).value === "" ? null : +f(n).value, txt = n => f(n).value.trim() || null;
    msg.textContent = "Recording the sale…";
    const { error } = await sb.schema("pipeline").rpc("record_sale", {
      p_deal: d.id, p_price: price, p_date: date, p_buyer: txt("rs_buyer"), p_cap_rate: num("rs_cap"), p_seller: txt("rs_seller"),
      p_source: "broker", p_we_bought: f("rs_ours").checked, p_t12_noi: num("rs_noi"),
    });
    if(error){ msg.textContent = error.message; return; }
    const [{ data: row }, { data: logs }] = await Promise.all([
      sb.schema("pipeline").from("deals").select("*").eq("id", d.id).single(),
      sb.schema("pipeline").from("deal_log").select("id,deal_id,logged_on,kind,body").eq("deal_id", d.id).order("logged_on").order("id"),
    ]);
    const live = deals.find(x => x.id === d.id) || d;
    if(row) Object.assign(live, toDeal(row, logs || [], live._parcels));
    const noi = num("rs_noi"), cap = noi ? " at a " + (noi / price * 100).toFixed(2) + "% cap on the marketed T-12" : "";
    WB.toast("Sale recorded: " + WB.fmt.usd(price) + (txt("rs_buyer") ? " to " + txt("rs_buyer") : "") + cap + ". Added to Sale Comps.", 4200);
    renderList(); editing = live; paintEditor();
  };
}
function closeEditor(){ const m = document.getElementById("dealEd"); if(m) m.hidden = true; document.body.style.overflow = ""; editing = null; }
function readEditor(){
  const f = document.querySelector("#dealEd form"), o = {};
  FIELDS.forEach(([, fs]) => fs.forEach(([k, , t]) => {
    if(t === "sens") return;
    const el = f.elements[k]; if(!el || o.hasOwnProperty(k)) return;
    if(t === "check") o[k] = el.checked;
    else if(t === "num" || t === "int") o[k] = el.value === "" ? null : (t === "int" ? Math.round(+el.value) : +el.value);
    else o[k] = el.value.trim() === "" ? null : el.value.trim();
  }));
  return o;
}
async function saveEditor(e){
  e.preventDefault();
  const d = deals.find(x => x.id === editing.id), r = RW(d), o = readEditor(), msg = document.querySelector("#dealEd .msg");
  if(!o.name) return (msg.textContent = "A deal needs a name.");
  /* when only $/SF or only $/mo is entered, fill the other from the average unit size */
  const avg = o.avg_unit_sf ?? N(r.avg_unit_sf);
  if(avg) [["uw.mktRentPsf", "uw.mktRentMo"], ["uw.effRentPsf", "uw.effRentMo"]].forEach(([a, b]) => {
    if(o[a] != null && o[b] == null && fv(r, b) == null) o[b] = Math.round(o[a] * avg);
    else if(o[b] != null && o[a] == null && fv(r, a) == null) o[a] = +(o[b] / avg).toFixed(2);
  });
  const changed = Object.keys(o).filter(k => String(o[k] ?? "") !== String(fv(r, k) ?? ""));
  if(!changed.length){ closeEditor(); return; }
  const patch = Object.fromEntries(changed.filter(k => !k.startsWith("uw.")).map(k => [k, o[k]]));
  const uwKeys = changed.filter(k => k.startsWith("uw."));
  if(uwKeys.length) patch.uw = mergeRow(r, Object.fromEntries(uwKeys.map(k => [k, o[k]]))).uw;
  msg.textContent = "Saving…";
  const { data: row, error } = await sb.schema("pipeline").from("deals").update(patch).eq("id", d.id).select().single();
  if(error){ msg.textContent = error.message; return; }
  const LBL = Object.fromEntries(FIELDS.flatMap(g => g[1]).map(f => [f[0], f[1].replace(/ \(.*\)$/, "").toLowerCase()]));
  const notes = [];
  if(patch.stage) notes.push({deal_id: d.id, kind: "stage", body: "Stage: " + (STAGES[r.stage === "under_contract" ? "contract" : r.stage] || r.stage) + " → " + (STAGES[row.stage === "under_contract" ? "contract" : row.stage] || row.stage) + "."});
  const rest = changed.filter(k => k !== "stage");
  if(rest.length) notes.push({deal_id: d.id, kind: "note", body: "Updated " + rest.map(k => LBL[k] || k).join(", ") + "."});
  if(notes.length) await sb.schema("pipeline").from("deal_log").insert(notes);
  Object.assign(d, toDeal(row, [], d._parcels), {log: d.log.concat(notes.map(n => [isoToday(), n.body]))});
  closeEditor(); renderList();
  WB.toast(patch.stage || patch.kind ? "Saved. The player picks up stage and type changes next time the page loads." : "Saved");
}

      + row("Developer", p.dev ? E(p.dev) : null) + row("Manager", p.mgr ? E(p.mgr) : null) + row("Status", p.status ? E(p.status) : null);
    if(id === "land") return "<h4>" + E(p.name) + "</h4><p>" + E([p.city, p.address, dt(p.date)].filter(Boolean).join(" · ")) + "</p>"
      + row("Price", M(p.price)) + row("Acres", p.acres != null ? (+p.acres).toFixed(2) : null) + row("Planned units", num(p.pu))
      + row("Per door", p.ppu ? M(p.ppu) : null) + row("Per acre", p.price && p.acres ? M(p.price / p.acres) : null)
      + row("Per land SF", p.psf ? "$" + (+p.psf).toFixed(2) : null) + row("Product", p.product ? E(p.product) : null)
      + row("Seller", p.seller ? E(p.seller) : null) + row("Buyer", p.buyer ? E(p.buyer) : null) + row("Broker", p.broker ? E(p.broker) : null)
      + '<a href="../comps/?comp=' + p.id + '">Open in Sale Comps</a>';
    return "<h4>" + E(p.name) + "</h4><p>" + E([p.address || p.city, dt(p.date)].filter(Boolean).join(" · ")) + "</p>"
      + row("Price", M(p.price)) + row("Per unit", p.ppu ? M(p.ppu) : null) + row("Per SF", p.bsf ? "$" + (+p.bsf).toFixed(0) : null)
      + row("Cap rate", p.cap ? (+p.cap).toFixed(2) + "%" : null) + row("Units", num(p.units)) + row("Built", p.yb)
      + row("Product", p.product ? E(p.product) : null) + row("Construction", p.cons ? E(p.cons) : null) + row("Submarket", p.sub ? E(p.sub) : null)
      + row("Seller", p.seller ? E(p.seller) : null) + row("Buyer", p.buyer ? E(p.buyer) : null) + row("Broker", p.broker ? E(p.broker) : null)
      + '<a href="../comps/?comp=' + p.id + '">Open in Sale Comps</a>';
  }
  /* ---------- parcel outlines for comps in view (looked up by point, cached in this browser) ---------- */
  const PZ = 13, PKEY = "wb_comp_parcels_v1", on = new Set();
  let PC = {}; try { PC = JSON.parse(localStorage.getItem(PKEY) || "{}") || {}; } catch(e){ PC = {}; }
  let saveT = null, drawT = null, queue = [], busy = 0, hinted = false;
  const savePC = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(PKEY, JSON.stringify(PC)); } catch(e){ /* storage full: keep in memory only */ } }, 800); };
  const colorExpr = ["match", ["get", "t"], "inv", "#432890", "land", "#2F6B3A", "#8C8FE6"];
  function ensureParcelLayers(map){
    if(map.getSource("lyr-parcels")) return;
    map.addSource("lyr-parcels", {type: "geojson", data: fc([])});
    map.addLayer({id: "lyr-parcels-fill", type: "fill", source: "lyr-parcels", minzoom: 12, paint: {"fill-color": colorExpr, "fill-opacity": .14}});
    map.addLayer({id: "lyr-parcels-line", type: "line", source: "lyr-parcels", minzoom: 12, paint: {"line-color": colorExpr, "line-width": ["interpolate", ["linear"], ["zoom"], 12, 1, 16, 2.2], "line-opacity": .95}});
    map.on("click", "lyr-parcels-fill", e => {
      const f = e.features && e.features[0]; if(!f) return;
      const t = f.properties.t, src = data[t] && data[t].features.find(x => String(x.properties.id) === String(f.properties.id));
      if(src) openPopup(map, t, src.geometry.coordinates, src.properties);
    });
    map.on("mouseenter", "lyr-parcels-fill", () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", "lyr-parcels-fill", () => { map.getCanvas().style.cursor = ""; });
  }
  function drawParcels(){
    clearTimeout(drawT);
    drawT = setTimeout(() => {
      const map = window.__pmap; if(!map || !map.getSource("lyr-parcels")) return;
      const feats = [];
      on.forEach(t => (data[t] ? data[t].features : []).forEach(f => {
        const c = PC[t + ":" + f.properties.id];
        if(c) feats.push({type: "Feature", properties: {t, id: f.properties.id}, geometry: {type: "Polygon", coordinates: c}});
      }));
      map.getSource("lyr-parcels").setData(fc(feats));
    }, 120);
  }
  function pump(){
    while(busy < 4 && queue.length){
      const job = queue.shift(); busy++;
      parcelAt(job.lng, job.lat).then(r => {
        PC[job.k] = r && r.coords ? r.coords.map(ring => ring.map(xy => [+xy[0].toFixed(6), +xy[1].toFixed(6)])) : 0;
        savePC(); drawParcels();
      }).catch(() => {}).finally(() => { busy--; pump(); });
    }
  }
  function fetchInView(){
    const map = window.__pmap; if(!map || !on.size) return;
    if(map.getZoom() < PZ){ if(!hinted){ hinted = true; WB.toast("Zoom in to see comp parcels"); } return; }
    const b = map.getBounds(), c = map.getCenter(), seen = new Set(queue.map(j => j.k));
    const want = [];
    on.forEach(t => (data[t] ? data[t].features : []).forEach(f => {
      const [lng, lat] = f.geometry.coordinates, k = t + ":" + f.properties.id;
      if(k in PC || seen.has(k) || !b.contains([lng, lat])) return;
      want.push({k, lng, lat, d: (lng - c.lng) ** 2 + (lat - c.lat) ** 2});
    }));
    queue = queue.concat(want.sort((a, z) => a.d - z.d).slice(0, 60));
    pump();
  }
  let popup = null;
  function openPopup(map, id, coords, props){
    if(popup) popup.remove();
    popup = new maplibregl.Popup({closeButton: true, maxWidth: "280px", className: "lyr-pop"}).setLngLat(coords).setHTML(popupHtml(id, props)).addTo(map);
  }
  let moveHooked = false;
  function onSet(id, v){ if(v) on.add(id); else { on.delete(id); queue = queue.filter(j => !j.k.startsWith(id + ":")); } drawParcels(); if(v) fetchInView(); }
  async function toggle(id, show){
    const map = window.__pmap; if(!map) return;
    const src = "lyr-" + id;
    if(!show){ if(map.getLayer(src)) map.setLayoutProperty(src, "visibility", "none"); onSet(id, false); return; }
    const el = box.querySelector('[data-l="' + id + '"]'); el.disabled = true;
    try {
      const fcData = await load(id);
      const add = () => {
        if(!map.getSource(src)){
          map.addSource(src, {type: "geojson", data: fcData});
          ensureParcelLayers(map);
          const L = LAYERS.find(l => l.id === id);
          map.addLayer({id: src, type: "circle", source: src, paint: {
            "circle-radius": ["interpolate", ["linear"], ["zoom"], 8, id === "prop" ? 2.5 : 3.5, 14, id === "prop" ? 6 : 8],
            "circle-color": L.color, "circle-stroke-color": "#fff", "circle-stroke-width": 1.2, "circle-opacity": .95}});
          map.on("click", src, e => {
            const f = e.features && e.features[0]; if(!f) return;
            openPopup(map, id, f.geometry.coordinates, f.properties);
          });
          map.on("mouseenter", src, () => { map.getCanvas().style.cursor = "pointer"; });
          map.on("mouseleave", src, () => { map.getCanvas().style.cursor = ""; });
        } else map.setLayoutProperty(src, "visibility", "visible");
        if(!moveHooked){ moveHooked = true; map.on("moveend", fetchInView); }
        onSet(id, true);
      };
      await new Promise(ok => { const go = () => (map.style && map.style._loaded) ? ok() : setTimeout(go, 120); go(); });
      add();
      WB.toast(fcData.features.length.toLocaleString("en-US") + " " + LAYERS.find(l => l.id === id).label.toLowerCase() + " on the map");
    } catch(err){ WB.toast(err.message || String(err)); el.checked = false; }
    el.disabled = false;
  }
  box.addEventListener("change", e => { const c = e.target.closest("[data-l]"); if(c) toggle(c.dataset.l, c.checked); });
})();

/* render the first slide as soon as the data is in; the satellite basemap catches up and camera() fires on its load */
ready = true; go(START); if(!START) loop();
initMap();
})();
</script>
