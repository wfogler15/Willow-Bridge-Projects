<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sale comps · Willow Bridge Intel</title>
<link rel="icon" href="../shared/wb-mark.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="../shared/wb.css?v=202610201028">
<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  .page{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;width:100%;max-width:none;padding-top:16px;padding-bottom:20px}
  .wb-band{flex:none}
  .toolbar .input[type=search]{width:280px}
  .chip-near{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 6px 0 10px;border-radius:6px;background:var(--selected);color:var(--ink);font-weight:600;font-size:var(--fs);border:1px solid var(--purple)}
  .chip-near button{border:0;background:none;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
  .split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,34%);gap:16px}
  .split>.sec{display:flex;flex-direction:column;min-height:0;margin:0}
  .tablewrap{overflow:auto;flex:1;min-height:0;border-top:1px solid var(--rule-2)}
  .tbl th{border-top:0}
  .tbl td.t{max-width:180px;overflow:hidden;text-overflow:ellipsis}
  .tbl td.name{max-width:300px}
  .tbl td.name small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stats{display:flex;flex-wrap:wrap;gap:16px 56px;padding:12px 0 20px}
  .tbl .r,.tbl th.r{text-align:left}
  .split{gap:40px}
  #stats .fig .v{font-size:26px}
  .split>.sec>.sec-h{border-bottom:1px solid var(--ink)}
  #mapPanel{overflow:hidden}
  #map{flex:1;min-height:0}
  .dot{width:11px;height:11px;border-radius:50%;border:2px solid #fff;background:var(--asset);box-shadow:0 0 0 1px rgba(22,20,43,.35);cursor:pointer}
  .dot.land{background:var(--land)}
  .dot.sel{width:17px;height:17px;background:var(--purple);box-shadow:0 0 0 3px rgba(67,40,144,.3)}
  .maplibregl-popup-content{font:13px/1.4 var(--font);color:var(--ink);border-radius:8px;padding:10px 12px}
  @media (max-width:980px){body{height:auto;overflow:auto}.split{grid-template-columns:1fr}#mapPanel{height:360px;order:-1}}
  /* drawer */
  .drawer{position:fixed;top:var(--wb-nav-h,48px);right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--rule);
    box-shadow:-12px 0 32px rgba(22,20,43,.12);z-index:60;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .2s}
  .drawer.open{transform:none}
  .drawer header{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--midnight);color:#fff}
  .drawer header h2{margin:0;font:600 var(--fs-lg)/1.2 var(--font-display);flex:1}
  .drawer header .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.24);color:#fff}
  .drawer header .btn:hover{background:rgba(255,255,255,.16)}
  .drawer form{flex:1;overflow:auto;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-content:start}
  .drawer .input{width:100%}
  .drawer .full{grid-column:1/-1}
  .drawer footer{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--rule);background:var(--sunk)}
  .drawer .hint{font-size:12px;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){.drawer{transition:none}}
  #f-count:not(:empty){display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--purple);color:#fff;font-size:11px;line-height:18px;text-align:center}
  #fdrawer form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  #fdrawer .fx-h{grid-column:1/-1;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px;border-bottom:1px solid var(--rule);padding-bottom:4px}
  #fdrawer .fx-h:first-child{margin-top:0}
  #fdrawer label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
  #fdrawer label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:var(--fs)}
  #fdrawer .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1/-1}
  #fdrawer .pair .cap{grid-column:1/-1;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="page">
  <div class="figs" id="stats"></div>
  <div class="split">
    <section class="sec"><div class="sec-h"><h2 id="t-title">Sales</h2><span class="note">Click a heading to sort. Double-click a row to edit.</span></div>
      <div class="tablewrap"><table class="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section>
    <section class="sec" id="mapPanel"><div id="map"></div></section>
  </div>
</main>

<aside class="drawer" id="drawer">
  <header><h2 id="d-title">Add a comp</h2><button class="btn" type="button" id="d-close">Close</button></header>
  <form id="d-form" autocomplete="off"></form>
  <footer><button class="btn primary" id="d-save">Save comp</button><span class="hint" id="d-hint">Click the map to set the location.</span></footer>
</aside>
<aside class="drawer" id="fdrawer" aria-label="Filters">
  <header><h2>Filters</h2><button class="btn" type="button" id="f-close">Close</button></header>
  <form id="f-form" autocomplete="off"></form>
  <footer><button class="btn" type="button" id="f-clear">Clear all</button><span class="hint" id="f-hint"></span></footer>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../shared/wb.js?v=202610201028"></script>
<script>
(async () => {
  const { sb, user } = await WB.ready('comps');
  const { esc, fmt, median } = WB;
  const $ = (s) => document.querySelector(s);

  let rows = await WB.fetchAll('comps', 'sale_comps', '*', (q) => q.order('sale_date', { ascending: false, nullsFirst: false }));
  // fill per-door and per-land-SF figures when the inputs are there but the figure wasn't recorded
  for (const c of rows) {
    const doors = c.comp_type === 'land' ? c.proposed_units : c.units;
    if (c.price_per_unit == null && c.sale_price && doors) c.price_per_unit = c.sale_price / doors;
    if (c.comp_type === 'land' && c.price_per_land_sf == null && c.sale_price && c.acres) c.price_per_land_sf = c.sale_price / (c.acres * 43560);
  }
  const P = new URLSearchParams(location.search);
  let noLoc = P.get('attn') === 'location';
  const near = P.get('near') ? { at: P.get('near').split(',').map(Number), mi: +(P.get('mi') || 3) } : null;
  const miles = (c) => { if (c.lat == null || !near) return Infinity; const [la, lo] = near.at, r = Math.PI / 180, a = Math.sin((c.lat - la) * r / 2) ** 2 + Math.cos(la * r) * Math.cos(c.lat * r) * Math.sin((c.lng - lo) * r / 2) ** 2; return 7917.5 * Math.asin(Math.sqrt(a)); };
  WB.band({ title: 'Sale comps', lede: 'Investment and land sales in Denver and Phoenix, from our trackers, broker reports and CoStar.',
    actions: '<span id="near"></span><select class="fld" id="f-year" title="Calendar year of sale"><option value="">All years</option></select>'
      + '<select class="fld" id="f-since"><option value="">Any trailing period</option><option value="1">Last 12 months</option><option value="2">Last 2 years</option><option value="3">Last 3 years</option><option value="5">Last 5 years</option></select>'
      + '<input class="fld" id="f-q" type="search" placeholder="Search name, address, buyer, seller, broker" style="width:260px">'
      + '<button class="b" id="b-filter">Filters <span id="f-count"></span></button>'
      + '<button class="b" id="b-export">Export to Excel</button><button class="b primary" id="b-add">Add a comp</button>',
    tabs: '<button data-v="investment" class="on" role="tab">Investment sales</button><button data-v="land" role="tab">Land sales</button>' });
  document.querySelector('.wb-band .tabs').id = 'f-type';
  const state = { market: WB.getMarket(), type: 'investment', since: '', q: '', sort: 'sale_date', dir: -1, sel: null };

  // ---------- detailed filters (the Filters panel). Blank = no limit. Units/acres, price, $/unit, $/SF, cap, year built are ranges. ----------
  const FX = { product: '', submarket: '', minUnits: '', maxUnits: '', minAcres: '', maxAcres: '', minPrice: '', maxPrice: '',
    minPu: '', maxPu: '', minPsf: '', maxPsf: '', minCap: '', maxCap: '', minYb: '', maxYb: '',
    buyer: '', seller: '', broker: '', verifiedOnly: false, located: false };
  const fxNum = (v) => (v === '' || v == null ? null : +v);
  const inRange = (v, lo, hi) => {
    if (lo == null && hi == null) return true;
    if (v == null || v === '') return false;
    return (lo == null || +v >= lo) && (hi == null || +v <= hi);
  };
  const hasText = (val, needle) => !needle || (val && String(val).toLowerCase().includes(needle.toLowerCase()));
  const doorsOf = (c) => (c.comp_type === 'land' ? c.proposed_units : c.units);
  const psfOf = (c) => (c.comp_type === 'land' ? c.price_per_land_sf : c.price_per_sf);
  function passesFx(c) {
    const f = (k) => fxNum(FX[k]);
    return inRange(doorsOf(c), f('minUnits'), f('maxUnits')) && inRange(c.acres, f('minAcres'), f('maxAcres'))
      && inRange(c.sale_price, f('minPrice'), f('maxPrice')) && inRange(c.price_per_unit, f('minPu'), f('maxPu'))
      && inRange(psfOf(c), f('minPsf'), f('maxPsf')) && inRange(c.cap_rate, f('minCap'), f('maxCap'))
      && inRange(c.year_built, f('minYb'), f('maxYb'))
      && (!FX.product || c.product_type === FX.product) && (!FX.submarket || c.submarket === FX.submarket)
      && hasText(c.buyer, FX.buyer) && hasText(c.seller, FX.seller) && hasText(c.broker, FX.broker)
      && (!FX.verifiedOnly || c.verified) && (!FX.located || c.lat != null);
  }
  const activeFx = () => Object.entries(FX).filter(([k, v]) => v !== '' && v !== false && v != null).length;
  const FX_FIELDS = [
    ['pair', 'Units (existing) / doors (land)', 'minUnits', 'maxUnits'],
    ['pair', 'Acres', 'minAcres', 'maxAcres'],
    ['pair', 'Year built', 'minYb', 'maxYb'],
    ['h', 'Price'],
    ['pair', 'Sale price ($)', 'minPrice', 'maxPrice'],
    ['pair', '$/unit or $/door', 'minPu', 'maxPu'],
    ['pair', '$/SF or $/land SF', 'minPsf', 'maxPsf'],
    ['pair', 'Cap rate (%)', 'minCap', 'maxCap'],
    ['h', 'Parties'],
    ['text', 'Buyer contains', 'buyer'], ['text', 'Seller contains', 'seller'], ['text', 'Broker contains', 'broker'],
    ['h', 'Record'],
    ['chk', 'Verified only', 'verifiedOnly'], ['chk', 'Has a map location', 'located'],
  ];
  const LABELS = { minUnits: 'Min', maxUnits: 'Max', minAcres: 'Min', maxAcres: 'Max', minYb: 'From', maxYb: 'To', minPrice: 'Min', maxPrice: 'Max',
    minPu: 'Min', maxPu: 'Max', minPsf: 'Min', maxPsf: 'Max', minCap: 'Min', maxCap: 'Max' };
  function buildFxForm() {
    const vals = (k) => [...new Set(rows.filter((r) => r[k]).map((r) => r[k]))].sort();
    const sel = (k, list) => `<option value="">Any</option>` + list.map((v) => `<option value="${esc(v)}" ${FX[k] === v ? 'selected' : ''}>${esc(v)}</option>`).join('');
    $('#f-form').innerHTML = FX_FIELDS.map((r) => {
      if (r[0] === 'h') return `<div class="fx-h">${r[1]}</div>`;
      if (r[0] === 'pair') return `<div class="pair"><div class="cap">${r[1]}</div>`
        + [r[2], r[3]].map((k) => `<label>${LABELS[k]}<input class="input" name="${k}" type="number" step="any" value="${esc(FX[k])}"></label>`).join('') + '</div>';
      if (r[0] === 'chk') return `<label class="chk"><input type="checkbox" name="${r[2]}" ${FX[r[2]] ? 'checked' : ''}> ${r[1]}</label>`;
      if (r[0] === 'text') return `<label>${r[1]}<input class="input" name="${r[2]}" type="search" value="${esc(FX[r[2]])}"></label>`;
      return '';
    }).join('');
    // dropdowns for product and submarket (distinct values from the data), placed first
    const top = `<label>Product<select class="input" name="product">${sel('product', vals('product_type'))}</select></label>`
      + `<label>Submarket<select class="input" name="submarket">${sel('submarket', vals('submarket'))}</select></label>`;
    $('#f-form').insertAdjacentHTML('afterbegin', `<div class="fx-h">Property</div>` + top);
  }
  function readFx() {
    const f = $('#f-form');
    for (const k of Object.keys(FX)) {
      const el = f.elements[k]; if (!el) continue;
      FX[k] = el.type === 'checkbox' ? el.checked : (el.value || '');
    }
    const n = activeFx();
    $('#f-count').textContent = n ? String(n) : '';
    $('#f-hint').textContent = n ? `${n} filter${n === 1 ? '' : 's'} on` : 'No filters on';
  }

  // ---------- columns ----------
  const COLS = {
    investment: [
      ['sale_date', 'Date', (c) => fmt.date(c.sale_date)],
      ['name', 'Property', (c) => `${esc(c.name || '—')}<small>${esc([c.address, c.city || c.submarket].filter(Boolean).join(', '))}</small>`, 'name'],
      ['units', 'Units', (c) => fmt.int(c.units), 'r'],
      ['year_built', 'Built', (c) => c.year_built ?? '—', 'r'],
      ['sale_price', 'Price', (c) => fmt.usd(c.sale_price), 'r'],
      ['price_per_unit', '$/unit', (c) => fmt.usd(c.price_per_unit), 'r'],
      ['price_per_sf', '$/SF', (c) => c.price_per_sf ? '$' + fmt.int(c.price_per_sf) : '—', 'r'],
      ['cap_rate', 'Cap', (c) => fmt.pct(c.cap_rate, 2), 'r'],
      ['buyer', 'Buyer', (c) => `<span title="${esc(c.buyer || '')}">${esc(c.buyer || '—')}</span>`, 't'],
      ['seller', 'Seller', (c) => `<span title="${esc(c.seller || '')}">${esc(c.seller || '—')}</span>`, 't'],
      ['broker', 'Broker', (c) => `<span title="${esc(c.broker || '')}">${esc(c.broker || '—')}</span>`, 't'],
      ['verified', '', (c) => c.verified ? '<span class="ok" title="Verified">✓</span>' : ''],
    ],
    land: [
      ['sale_date', 'Date', (c) => fmt.date(c.sale_date)],
      ['name', 'Site', (c) => `${esc(c.name || '—')}<small>${esc([c.address, c.submarket || c.city].filter(Boolean).join(', '))}</small>`, 'name'],
      ['acres', 'Acres', (c) => fmt.ac(c.acres), 'r'],
      ['proposed_units', 'Units', (c) => fmt.int(c.proposed_units), 'r'],
      ['sale_price', 'Price', (c) => fmt.usd(c.sale_price), 'r'],
      ['price_per_unit', '$/door', (c) => fmt.usd(c.price_per_unit), 'r'],
      ['price_per_land_sf', '$/land SF', (c) => fmt.psf(c.price_per_land_sf), 'r'],
      ['product_type', 'Product', (c) => esc([c.product_type, c.construction_type].filter(Boolean).join(', ') || '—'), 't'],
      ['buyer', 'Buyer', (c) => `<span title="${esc(c.buyer || '')}">${esc(c.buyer || '—')}</span>`, 't'],
      ['seller', 'Seller', (c) => `<span title="${esc(c.seller || '')}">${esc(c.seller || '—')}</span>`, 't'],
      ['verified', '', (c) => c.verified ? '<span class="ok" title="Verified">✓</span>' : ''],
    ],
  };

  // ---------- filtering ----------
  document.addEventListener('click', (e) => { if (e.target.id === 'clrattn') { noLoc = false; history.replaceState(null, '', location.pathname); render(); } });
  function filtered(ignoreDate) {
    const cut = state.since && !ignoreDate ? new Date(Date.now() - state.since * 365.25 * 864e5).toISOString().slice(0, 10) : null;
    const yr = state.year && !ignoreDate ? state.year : null;   // calendar year; the YTD comparison ignores it
    const q = state.q.toLowerCase();
    const out = rows.filter((c) =>
      c.comp_type === state.type &&
      (state.market === 'all' || c.market_id === state.market) &&
      (!near || miles(c) <= near.mi) &&
      (!noLoc || c.lat == null) &&
      (!cut || (c.sale_date && c.sale_date >= cut)) &&
      (!yr || (c.sale_date || '').startsWith(yr)) &&
      passesFx(c) &&
      (!q || [c.name, c.address, c.city, c.submarket, c.buyer, c.seller, c.broker, c.notes].some((v) => v && v.toLowerCase().includes(q))));
    const k = state.sort, d = state.dir;
    const TEXT = ['name', 'buyer', 'seller', 'broker', 'product_type', 'sale_date', 'verified'];
    out.sort((a, b) => {
      const x = a[k], y = b[k];
      if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;   // blanks always last
      return (TEXT.includes(k) ? String(x).localeCompare(String(y)) : (+x - +y)) * d;
    });
    return out;
  }

  // ---------- render ----------
  function render() {
    const list = filtered(), cols = COLS[state.type];
    const scoped = !!(state.since || state.year || activeFx());   // any narrowing beyond the type and market
    $('#thead').innerHTML = '<tr>' + cols.map(([k, l, , cls]) =>
      `<th data-k="${k}" class="sortable ${cls === 'r' ? 'r' : ''} ${state.sort === k ? 'sorted' : ''}">${l}${state.sort === k ? (state.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('') + '</tr>';
    $('#tbody').innerHTML = list.map((c) => `<tr data-id="${c.id}" class="${state.sel === c.id ? 'sel' : ''}">` +
      cols.map(([k, , f, cls]) => `<td class="${cls || ''}">${f(c)}</td>`).join('') + '</tr>').join('')
      || `<tr><td colspan="${cols.length}" class="empty">No comps match these filters. Widen the date range or clear the search.</td></tr>`;
    const s = state.type === 'investment'
      ? [[list.length, 'sales'], [fmt.usd(list.reduce((t, c) => t + (+c.sale_price || 0), 0)), scoped ? 'volume in view' : 'total volume, all years'], [(() => { const r = list.filter((c) => c.sale_price && c.units); const u = r.reduce((t, c) => t + +c.units, 0); return u ? fmt.usd(r.reduce((t, c) => t + +c.sale_price, 0) / u) : '—'; })(), 'avg $/unit'], [fmt.usd(median(list.map((c) => c.price_per_unit))), 'median $/unit'],
         [list.some((c) => c.price_per_sf) ? '$' + fmt.int(median(list.map((c) => c.price_per_sf))) : '—', 'median $/SF'],
         [fmt.pct(median(list.map((c) => c.cap_rate)), 2), 'median cap']]
      : [[list.length, 'sales'], [fmt.usd(list.reduce((t, c) => t + (+c.sale_price || 0), 0)), scoped ? 'volume in view' : 'total volume, all years'], [fmt.psf(median(list.map((c) => c.price_per_land_sf))), 'median $/land SF'],
         [fmt.usd(median(list.map((c) => c.price_per_unit))), 'median $/door'], [fmt.ac(median(list.map((c) => c.acres))), 'median acres']];
    // this year to date against the same stretch of last year (same filters, ignoring the date filter), then the full set
    const base = filtered(true), now = new Date(), Y = now.getFullYear(), md = now.toISOString().slice(5, 10);
    const vol = (xs) => xs.reduce((t, c) => t + (+c.sale_price || 0), 0);
    const ytd = base.filter((c) => (c.sale_date || '') >= `${Y}-01-01` && c.sale_date <= `${Y}-${md}`);
    const lytd = base.filter((c) => (c.sale_date || '') >= `${Y - 1}-01-01` && c.sale_date <= `${Y - 1}-${md}`);
    const lyFull = base.filter((c) => (c.sale_date || '').startsWith(String(Y - 1)));
    const chg = vol(lytd) ? (vol(ytd) / vol(lytd) - 1) * 100 : null;
    const F = (v, l) => `<div class="fig"><div class="v">${v}</div><div class="l">${l}</div></div>`;
    const inv = state.type === 'investment';
    $('#stats').innerHTML = F(fmt.usd(vol(ytd)), `${Y} to date, ${ytd.length} ${ytd.length === 1 ? 'sale' : 'sales'}`)
      + F(chg == null ? '—' : (chg >= 0 ? '+' : '−') + Math.abs(chg).toFixed(0) + '%', `vs. ${fmt.usd(vol(lytd))} this time last year`)
      + F(fmt.usd(vol(lyFull)), `All of ${Y - 1}, ${lyFull.length} sales`)
      + (inv ? F(fmt.usd(median(list.map((c) => c.price_per_unit))), 'Median per unit') + F(fmt.pct(median(list.map((c) => c.cap_rate)), 2), 'Median cap rate')
             : F(fmt.psf(median(list.map((c) => c.price_per_land_sf))), 'Median per land SF') + F(fmt.usd(median(list.map((c) => c.price_per_unit))), 'Median per door'))
      + F(fmt.usd(list.reduce((t, c) => t + (+c.sale_price || 0), 0)), `${list.length} ${list.length === 1 ? 'sale' : 'sales'} ${scoped ? 'in view' : 'on record'}`);
    void s;
    $('#t-title').innerHTML = esc(`${list.length.toLocaleString('en-US')} ${state.type === 'land' ? 'land' : 'investment'} ${list.length === 1 ? 'sale' : 'sales'}${noLoc ? ' missing a location' : ''}`) + (noLoc ? ' <button class="link" id="clrattn" type="button">Show all</button>' : '');
    $('#near').innerHTML = near ? `<span class="chip-near">Within ${near.mi} miles of the selected deal<button type="button" id="near-x" title="Show all comps">×</button></span>` : '';
    drawMarkers(list);
  }

  // ---------- map ----------
  const map = new maplibregl.Map({
    container: 'map', attributionControl: { compact: true },
    style: { version: 8, sources: {
      img: { type: 'raster', tileSize: 256, attribution: 'Esri', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'] },
      roads: { type: 'raster', tileSize: 256, tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}'] } },
      layers: [{ id: 'img', type: 'raster', source: 'img' }, { id: 'roads', type: 'raster', source: 'roads', paint: { 'raster-opacity': .7 } }] },
    center: [-108.4, 36.6], zoom: 4.6,
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.on('load', () => { if (!map._fitOnce) drawMarkers(filtered()); });
  let markers = [];
  function drawMarkers(list) {
    markers.forEach((m) => m.remove()); markers = [];
    const pts = list.filter((c) => c.lat != null && c.lng != null);
    for (const c of pts) {
      const el = document.createElement('div'); el.style.cssText = 'width:18px;height:18px;display:grid;place-items:center';
      const dot = document.createElement('div'); dot.className = 'dot' + (c.comp_type === 'land' ? ' land' : '') + (state.sel === c.id ? ' sel' : '');
      el.appendChild(dot);
      el.onclick = (e) => { e.stopPropagation(); select(c.id, true); };
      markers.push(new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([c.lng, c.lat]).addTo(map));
    }
    if (!state.sel && pts.length && !map._fitOnce) {
      const b = new maplibregl.LngLatBounds(); pts.forEach((c) => b.extend([c.lng, c.lat]));
      map.fitBounds(b, { padding: 40, maxZoom: 12, duration: 0 });
    }
  }
  function select(id, fromMap) {
    state.sel = id; render();
    const c = rows.find((r) => r.id === id);
    const tr = document.querySelector(`tr[data-id="${id}"]`);
    if (tr && fromMap) tr.scrollIntoView({ block: 'center', behavior: 'smooth' });
    if (c && c.lat != null && !fromMap) map.flyTo({ center: [c.lng, c.lat], zoom: Math.max(map.getZoom(), 13) });
  }

  // ---------- events ----------
  const seg = (id, key) => $(id).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    $(id).querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    state[key] = b.dataset.v; state.sel = null; map._fitOnce = false; render();
  });
  seg('#f-type', 'type');
  window.addEventListener('wb:market', (e) => { state.market = e.detail; state.sel = null; map._fitOnce = false; render(); });
  document.addEventListener('click', (e) => { if (e.target.id === 'near-x') { location.href = location.pathname; } });
  $('#f-since').onchange = (e) => { state.since = e.target.value; render(); };
  $('#f-q').oninput = (e) => { state.q = e.target.value; render(); };
  $('#thead').addEventListener('click', (e) => {
    const th = e.target.closest('th'); if (!th || !th.dataset.k) return;
    state.dir = state.sort === th.dataset.k ? -state.dir : (th.dataset.k === 'name' ? 1 : -1); state.sort = th.dataset.k; render();
  });
  $('#tbody').addEventListener('click', (e) => { const tr = e.target.closest('tr[data-id]'); if (tr) select(tr.dataset.id, false); });
  $('#tbody').addEventListener('dblclick', (e) => { const tr = e.target.closest('tr[data-id]'); if (tr) openDrawer(rows.find((r) => r.id === tr.dataset.id)); });
  map.on('dragstart', () => { map._fitOnce = true; });

  // ---------- export ----------
  // Export everything (every market, both types) so the quarterly archive is complete; one sheet per type.
  $('#b-export').onclick = () => {
    const INV = ['Sale date', 'Market', 'Property', 'Address', 'City', 'Submarket', 'Units', 'Year built', 'Price', '$/unit', '$/SF', 'Cap rate %', 'Product', 'Buyer', 'Seller', 'Broker', 'Notes', 'Source', 'Source link', 'Verified', 'Latitude', 'Longitude'];
    const LAND = ['Sale date', 'Market', 'Site', 'Address', 'City', 'Submarket', 'Acres', 'Proposed units', 'Price', '$/door', '$/land SF', 'Product', 'Construction', 'Buyer', 'Seller', 'Broker', 'Notes', 'Source', 'Source link', 'Verified', 'Latitude', 'Longitude'];
    const by = (t) => rows.filter((c) => c.comp_type === t).sort((a, b) => (b.sale_date || '').localeCompare(a.sale_date || ''));
    const inv = by('investment').map((c) => [c.sale_date, WB.marketLabel(c.market_id), c.name, c.address, c.city, c.submarket, c.units, c.year_built, num(c.sale_price), num(c.price_per_unit), num(c.price_per_sf), num(c.cap_rate), c.product_type, c.buyer, c.seller, c.broker, c.notes, c.source, c.source_url, c.verified ? 'Yes' : '', num(c.lat), num(c.lng)]);
    const land = by('land').map((c) => [c.sale_date, WB.marketLabel(c.market_id), c.name, c.address, c.city, c.submarket, num(c.acres), c.proposed_units, num(c.sale_price), num(c.price_per_unit), num(c.price_per_land_sf), c.product_type, c.construction_type, c.buyer, c.seller, c.broker, c.notes, c.source, c.source_url, c.verified ? 'Yes' : '', num(c.lat), num(c.lng)]);
    const wb = XLSX.utils.book_new();
    [['Investment sales', INV, inv], ['Land sales', LAND, land]].forEach(([name, head, data]) => {
      const ws = XLSX.utils.aoa_to_sheet([head, ...data]);
      ws['!cols'] = head.map((h) => ({ wch: Math.max(10, h.length + 2) }));
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: data.length, c: head.length - 1 } }) };
      XLSX.utils.book_append_sheet(wb, ws, name);
    });
    XLSX.writeFile(wb, `WB Sale Comps - all markets - ${new Date().toISOString().slice(0, 10)}.xlsx`);
    WB.toast(`Exported ${inv.length + land.length} comps, all markets`);
  };
  const num = (v) => (v == null || v === '' ? null : +v);

  // ---------- add / edit ----------
  const F = [
    ['comp_type', 'Type', 'select:investment=Investment,land=Land'], ['market_id', 'Market', 'select:denver=Denver,phoenix=Phoenix'],
    ['name', 'Name', 'text', 'full'], ['address', 'Address', 'text', 'full'], ['city', 'City', 'text'], ['submarket', 'Submarket', 'text'],
    ['sale_date', 'Sale date', 'date'], ['sale_price', 'Sale price ($)', 'number'],
    ['units', 'Units (existing)', 'number', '', 'investment'], ['year_built', 'Year built', 'number', '', 'investment'],
    ['price_per_sf', '$/SF (net rentable)', 'number', '', 'investment'], ['cap_rate', 'Cap rate (%)', 'number', '', 'investment'],
    ['acres', 'Acres', 'number', '', 'land'], ['proposed_units', 'Proposed units', 'number', '', 'land'],
    ['product_type', 'Product', 'text'], ['construction_type', 'Construction', 'text', '', 'land'],
    ['buyer', 'Buyer', 'text'], ['seller', 'Seller', 'text'], ['broker', 'Broker', 'text', 'full'],
    ['source', 'Source', 'select:manual=Entered by hand,broker=Broker,article=Article,costar=CoStar,claude=Claude'], ['source_url', 'Source link', 'text'],
    ['notes', 'Notes', 'textarea', 'full'], ['verified', 'Verified', 'checkbox', 'full'],
    ['lat', 'Latitude', 'number'], ['lng', 'Longitude', 'number'],
  ];
  let editing = null, pin = null;
  function openDrawer(c) {
    editing = c || null;
    const v = c || { comp_type: state.type, market_id: state.market === 'all' ? 'denver' : state.market, source: 'manual', verified: true };
    $('#d-title').textContent = c ? 'Edit comp' : 'Add a comp';
    $('#d-form').innerHTML = F.map(([k, l, t, cls, only]) => {
      const val = v[k] ?? '';
      if (only && only !== v.comp_type) return '';
      let inp;
      if (t.startsWith('select:')) inp = `<select class="input" name="${k}">${t.slice(7).split(',').map((o) => { const [a, b] = o.split('='); return `<option value="${a}" ${a === val ? 'selected' : ''}>${b}</option>`; }).join('')}</select>`;
      else if (t === 'textarea') inp = `<textarea class="input" name="${k}" rows="3">${esc(val)}</textarea>`;
      else if (t === 'checkbox') return `<label class="full" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="${k}" ${val ? 'checked' : ''}> ${l}</label>`;
      else inp = `<input class="input" name="${k}" type="${t}" step="any" value="${esc(val)}">`;
      return `<div class="field ${cls || ''}"><label>${l}</label>${inp}</div>`;
    }).join('');
    $('#d-form').comp_type.onchange = (e) => { const cur = readForm(); cur.comp_type = e.target.value; openDrawer(editing ? { ...editing, ...cur } : null); if (!editing) fill(cur); };
    $('#drawer').classList.add('open');
  }
  function fill(v) { for (const [k] of F) { const el = $('#d-form')[k]; if (el && v[k] != null) { if (el.type === 'checkbox') el.checked = !!v[k]; else el.value = v[k]; } } }
  function readForm() {
    const f = $('#d-form'), o = {};
    for (const [k, , t] of F) {
      const el = f[k]; if (!el) continue;
      if (t === 'checkbox') o[k] = el.checked;
      else if (t === 'number') o[k] = el.value === '' ? null : +el.value;
      else o[k] = el.value.trim() === '' ? null : el.value.trim();
    }
    return o;
  }
  $('#b-add').onclick = () => openDrawer(null);
  $('#d-close').onclick = () => { $('#drawer').classList.remove('open'); if (pin) { pin.remove(); pin = null; } };
  map.on('click', (e) => {
    if (!$('#drawer').classList.contains('open')) return;
    const f = $('#d-form'); f.lat.value = e.lngLat.lat.toFixed(6); f.lng.value = e.lngLat.lng.toFixed(6);
    if (pin) pin.remove(); pin = new maplibregl.Marker({ color: '#1D1247' }).setLngLat(e.lngLat).addTo(map);
  });
  $('#d-save').onclick = async () => {
    const o = readForm();
    if (!o.name && !o.address) return WB.toast('Add a name or address');
    // fill per-unit / per-acre figures when left blank
    if (o.sale_price) {
      const doors = o.comp_type === 'land' ? o.proposed_units : o.units;
      if (doors) o.price_per_unit = Math.round(o.sale_price / doors * 100) / 100;
      if (o.comp_type === 'land' && o.acres) o.price_per_land_sf = Math.round(o.sale_price / (o.acres * 43560) * 100) / 100;
    }
    if (o.comp_type === 'investment') { o.acres ??= editing?.acres ?? null; }
    const q = sb.schema('comps').from('sale_comps');
    const { data, error } = editing ? await q.update(o).eq('id', editing.id).select().single() : await q.insert(o).select().single();
    if (error) return WB.toast(error.message);
    if (editing) rows[rows.findIndex((r) => r.id === editing.id)] = data; else rows.unshift(data);
    $('#d-close').click(); state.sel = data.id; render(); WB.toast(editing ? 'Comp updated' : 'Comp added');
  };

  // year picker: every sale year on record, newest first
  const years = [...new Set(rows.map((c) => (c.sale_date || '').slice(0, 4)).filter(Boolean))].sort().reverse();
  $('#f-year').insertAdjacentHTML('beforeend', years.map((y) => `<option value="${y}">${y}</option>`).join(''));
  $('#f-year').onchange = (e) => { state.year = e.target.value; state.sel = null; render(); };
  // detailed filters: a drawer that re-renders as you type
  buildFxForm();
  $('#b-filter').onclick = () => { $('#drawer').classList.remove('open'); $('#fdrawer').classList.add('open'); };
  $('#f-close').onclick = () => $('#fdrawer').classList.remove('open');
  $('#f-form').addEventListener('input', () => { readFx(); render(); });
  $('#f-form').addEventListener('change', () => { readFx(); render(); });
  $('#f-clear').onclick = () => {
    Object.keys(FX).forEach((k) => { FX[k] = typeof FX[k] === 'boolean' ? false : ''; });
    buildFxForm(); readFx(); render();
  };
  if (near) { state.since = ''; }
  render();
  if (near) map.once('load', () => map.flyTo({ center: [near.at[1], near.at[0]], zoom: 12, duration: 0 }));
  if (P.get('comp')) { const c = rows.find((r) => r.id === P.get('comp')); if (c) { state.type = c.comp_type; document.querySelectorAll('#f-type button').forEach((b) => b.classList.toggle('on', b.dataset.v === c.comp_type)); select(c.id, true); } }
  if (P.get('add')) openDrawer(null);
})();
</script>
</body>
</html>
