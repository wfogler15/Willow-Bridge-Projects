<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Willow Bridge Intel</title>
<link rel="icon" href="shared/wb-mark.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shared/wb.css">
<style>
  main{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
  h1{font:600 26px/1.2 var(--display);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 24px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:32px}
  .tile{display:flex;flex-direction:column;gap:10px;text-decoration:none;background:var(--white);border:1px solid var(--hair);border-radius:12px;padding:18px;min-height:150px}
  .tile:hover{border-color:var(--sand)}
  .tile h2{margin:0;font:600 17px/1.2 var(--display)}
  .tile p{margin:0;color:var(--muted);font-size:13px}
  .tile .stat{margin-top:auto;display:flex;gap:18px;flex-wrap:wrap}
  .tile .stat div{display:flex;flex-direction:column}
  .tile .stat b{font:600 20px/1.1 var(--display);font-variant-numeric:tabular-nums}
  .tile .stat span{font-size:11.5px;color:var(--muted)}
  section{margin-top:8px}
  section h3{font:600 15px/1.2 var(--display);margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
  section h3 small{font:400 12.5px var(--font);color:var(--muted)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  @media (max-width:820px){.cols{grid-template-columns:1fr}}
  .list{background:var(--white);border:1px solid var(--hair);border-radius:12px;overflow:hidden}
  .row{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--hair2)}
  .row:first-child{border-top:0}
  .row .what{flex:1;min-width:0}
  .row .what b{font-weight:600}
  .row .what div{color:var(--muted);font-size:12.5px}
  .row .when{font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .row .when.due{color:var(--brick);font-weight:600}
  .row .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .row .acts .btn{padding:3px 9px;font-size:12px}
  .empty{padding:14px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main id="app"><div class="loading">Loading…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="shared/wb.js"></script>
<script>
(async () => {
  const { sb, user } = await WB.ready('home');
  const { esc, fmt } = WB;
  const app = document.getElementById('app');

  const [props, deals, comps, review] = await Promise.all([
    WB.fetchAll('core', 'properties', 'market_id,kind'),
    WB.fetchAll('pipeline', 'deals', 'id,name,market_id,kind,stage,bid_date,check_back_on,guidance', (q) => q.is('merged_into', null)),
    WB.fetchAll('comps', 'sale_comps', 'market_id,comp_type,sale_date'),
    WB.fetchAll('core', 'review_queue', '*', (q) => q.eq('status', 'open').order('id')),
  ]);

  const count = (arr, f) => arr.filter(f).length;
  const ACTIVE = ['screening', 'underwriting', 'loi', 'under_contract'];
  const today = new Date().toISOString().slice(0, 10);
  const in30 = new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10);
  const yr = new Date().getFullYear();

  const tile = (href, title, blurb, stats) => `
    <a class="tile" href="${href}"><h2>${title}</h2><p>${blurb}</p>
      <div class="stat">${stats.map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join('')}</div></a>`;

  const bids = deals.filter((d) => d.bid_date && d.bid_date >= today && ACTIVE.concat('prospect', 'monitor').includes(d.stage))
    .sort((a, b) => a.bid_date.localeCompare(b.bid_date));
  const checks = deals.filter((d) => d.check_back_on && d.check_back_on <= in30)
    .sort((a, b) => a.check_back_on.localeCompare(b.check_back_on));

  app.innerHTML = `
    <h1>Willow Bridge Intel</h1>
    <p class="sub">Denver and Phoenix · ${fmt.int(props.length)} properties, ${deals.length} deals, ${comps.length} sale comps.</p>
    <div class="tiles">
      ${tile('intel/', 'Market Intel', 'CoStar and RealPage by submarket, comp sets, rent and supply.',
        [[fmt.int(count(props, (p) => p.market_id === 'denver' && p.kind !== 'land')), 'Denver'], [fmt.int(count(props, (p) => p.market_id === 'phoenix' && p.kind !== 'land')), 'Phoenix']])}
      ${tile('scout/', 'Site Scout', 'Parcels, owners and sites on the map.',
        [[count(props, (p) => p.kind === 'land'), 'saved sites']])}
      ${tile('pipeline/', 'Pipeline', 'On-market deals for the weekly meeting, and every deal we have looked at.',
        [[count(deals, (d) => ACTIVE.includes(d.stage)), 'active'], [count(deals, (d) => d.stage === 'monitor' || d.stage === 'prospect'), 'watching'], [count(deals, (d) => ['passed', 'lost', 'dead', 'closed'].includes(d.stage)), 'archived']])}
      ${tile('comps/', 'Sale Comps', 'Master list of investment and land sales. Export to Excel.',
        [[count(comps, (c) => c.comp_type === 'investment'), 'investment'], [count(comps, (c) => c.comp_type === 'land'), 'land'], [count(comps, (c) => (c.sale_date || '') >= `${yr - 1}-01-01`), `since ${yr - 1}`]])}
    </div>
    <div class="cols">
      <section><h3>Coming up <small>bid dates and check-backs</small></h3><div class="list" id="upcoming"></div></section>
      <section><h3>Needs your call <small id="rq-count"></small></h3><div class="list" id="review"></div></section>
    </div>`;

  // upcoming
  const up = [
    ...bids.map((d) => ({ d, when: d.bid_date, label: 'Bids due' })),
    ...checks.map((d) => ({ d, when: d.check_back_on, label: 'Check back' })),
  ].sort((a, b) => a.when.localeCompare(b.when));
  document.getElementById('upcoming').innerHTML = up.length ? up.map(({ d, when, label }) => `
    <div class="row"><div class="what"><b>${esc(d.name)}</b><div>${label} · ${d.market_id === 'denver' ? 'Denver' : 'Phoenix'} · ${d.guidance ? fmt.usd(d.guidance) : 'unpriced'}</div></div>
      <div class="when ${when <= today ? 'due' : ''}">${fmt.date(when)}</div></div>`).join('')
    : '<div class="empty">No bid dates or check-backs in the next 30 days.</div>';

  // review queue: Will settles items here
  const rqEl = document.getElementById('review');
  const renderReview = () => {
    document.getElementById('rq-count').textContent = review.length ? `${review.length} open` : '';
    rqEl.innerHTML = review.length ? review.map((r) => `
      <div class="row" data-id="${r.id}"><div class="what">${esc(r.reason)}
        <div class="acts">
          ${/duplicate/i.test(r.reason) ? '<button class="btn" data-act="merged">Same deal, merged</button><button class="btn" data-act="kept_separate">Keep separate</button>' : '<button class="btn" data-act="fixed">Done</button>'}
          <button class="btn" data-act="dismissed">Dismiss</button>
        </div></div></div>`).join('')
      : '<div class="empty">Nothing waiting on you.</div>';
  };
  renderReview();
  rqEl.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = +b.closest('.row').dataset.id;
    const r = review.find((x) => x.id === id);
    // "Same deal": merge the two deals (first one is kept). Already-merged pairs just get closed.
    if (b.dataset.act === 'merged' && r.kind === 'deal' && Array.isArray(r.record_ids) && r.record_ids.length === 2) {
      const { error: mErr } = await sb.schema('pipeline').rpc('merge_deals', { p_keep: r.record_ids[0], p_drop: r.record_ids[1] });
      if (mErr && !/already-merged/.test(mErr.message)) return WB.toast(mErr.message);
    }
    const { error } = await sb.schema('core').from('review_queue')
      .update({ status: b.dataset.act, resolution: `Marked ${b.dataset.act.replace('_', ' ')} by ${user.email}` }).eq('id', id);
    if (error) return WB.toast(error.message);
    review.splice(review.findIndex((r) => r.id === id), 1); renderReview(); WB.toast('Saved');
  });
})();
</script>
</body>
</html>
