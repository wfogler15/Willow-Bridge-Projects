<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview · Willow Bridge Intel</title>
<link rel="icon" href="shared/wb-mark.png">
<link rel="stylesheet" href="shared/wb.css?v=202610201950">
<style>
  .ov{max-width:1180px}
  .kick{margin:0 0 12px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .ov h1{margin:0;font:500 38px/1.18 var(--font-display);letter-spacing:-.025em;max-width:860px;color:var(--ink)}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);column-gap:96px;row-gap:56px;margin-top:64px;align-items:start}
  .cell{min-width:0}
  .stack{display:flex;flex-direction:column;gap:56px;min-width:0}
  .hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--ink)}
  .hd h2{margin:0;font-size:15px;font-weight:600}
  .grp{margin:28px 0 2px;font-size:13px;color:var(--muted)}
  .rw{display:grid;grid-template-columns:minmax(0,1fr) 96px 96px 72px;gap:16px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--rule-2);font-size:15px;color:var(--ink);transition:background .1s}
  .rw:hover{background:var(--hover)}
  .rw:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
  .rw b{font-weight:500}
  .rw small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  .rw .n{color:var(--ink-2)} .rw .t{color:var(--muted);text-align:right;font-size:13px}
  .rw .dim{color:var(--faint)}
  .new{font-size:12px;color:var(--purple);font-weight:500;margin-left:6px}
  .none{padding:16px 0;color:var(--muted)}
  .fig2{padding:24px 0;border-bottom:1px solid var(--rule-2)}
  .fig2 .l{margin:0;font-size:13px;color:var(--muted)}
  .fig2 .v{margin:6px 0 0;font:500 32px/1.1 var(--font-display);letter-spacing:-.02em}
  .fig2 .s{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
  .side .hd+.fig2{padding-top:20px}
  .gap{margin-top:48px}
  .li{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--rule-2);font-size:14px;color:var(--ink)}
  a.li:hover{color:var(--purple)}
  .li .c{color:var(--muted);white-space:nowrap}
  .li .c.due{color:var(--brick);font-weight:600}
  .rq{padding:13px 0;border-bottom:1px solid var(--rule-2);font-size:14px}
  .rq .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .rq .btn{height:28px;font-size:13px;padding:0 8px;margin-left:-8px}
  @media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr);column-gap:0}}
  @media (max-width:700px){.ov h1{font-size:28px}.rw{grid-template-columns:minmax(0,1fr) 80px 72px}.rw .t{display:none}}
</style>
</head>
<body>
<main class="page ov">
  <div class="kick"><span id="date"></span><span id="mkt"></span></div>
  <h1 id="headline"><span class="skel" style="display:block;height:38px;width:70%"></span></h1>
  <!-- two columns on one grid, so each row's headers sit on the same line:
       row 1 In underwriting | Sale comps + Coming up; row 2 Screening | Needs attention -->
  <div class="cols">
    <section class="cell" id="c-uw">
      <div class="hd"><h2>In underwriting</h2><a class="link" href="pipeline/">Open pipeline</a></div>
      <div id="uw"></div>
    </section>
    <div class="cell stack">
      <section>
        <div class="hd"><h2>Sale comps this year</h2><a class="link" href="comps/">All comps</a></div>
        <div id="vol"></div>
      </section>
      <section>
        <div class="hd"><h2>Coming up</h2><span class="link" style="color:var(--muted);font-weight:400">Next 30 days</span></div>
        <div id="upcoming"></div>
      </section>
    </div>
    <section class="cell" id="c-sc">
      <div class="hd"><h2>Screening, new on market</h2><span class="link" style="color:var(--muted);font-weight:400" id="scn"></span></div>
      <div id="sc"></div>
    </section>
    <section class="cell">
      <div class="hd"><h2>Needs attention</h2></div>
      <div id="attn"></div>
    </section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="shared/wb.js?v=202610201950"></script>
<script>
(async () => {
  const { sb, user } = await WB.ready('home');
  const { esc } = WB;
  const $ = (s) => document.querySelector(s);
  const today = new Date(), iso = (d) => d.toISOString().slice(0, 10), todayIso = iso(today), in30 = iso(new Date(Date.now() + 30 * 864e5));
  const Y = today.getFullYear(), jan1 = `${Y}-01-01`, lyJan1 = `${Y - 1}-01-01`, lySame = `${Y - 1}-${todayIso.slice(5)}`;

  const [deals, comps, links, review, noLoc] = await Promise.all([
    WB.fetchAll('pipeline', 'deals', 'id,name,market_id,kind,stage,address,units,acres,guidance,bid_date,check_back_on,lat,lng,uw,first_seen,broker', (q) => q.is('merged_into', null)),
    WB.fetchAll('comps', 'sale_comps', 'id,market_id,comp_type,sale_date,sale_price', (q) => q.gte('sale_date', lyJan1)),
    WB.fetchAll('pipeline', 'deal_parcels', 'deal_id'),
    WB.fetchAll('core', 'review_queue', '*', (q) => q.eq('status', 'open').order('id')),
    sb.schema('comps').from('sale_comps').select('id', { count: 'exact', head: true }).is('lat', null).then((r) => r.count || 0, () => 0),
  ]);

  const MK = Object.fromEntries(WB.markets.map((m) => [m.id, m.short]));
  const UWS = ['underwriting', 'loi', 'under_contract'], ACTIVE = ['screening', ...UWS];
  const M = (v) => v == null || v === '' ? null : +v;
  const usdM = (v) => v == null ? null : v >= 1e9 ? `$${(v / 1e9).toFixed(2)}B` : v >= 1e6 ? `$${(v / 1e6).toFixed(v >= 1e8 ? 0 : 1)}M` : `$${Math.round(v / 1e3)}K`;
  const mon = (d) => new Date(d + 'T12:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const LAST_MEETING = (() => { const t = new Date(); const back = ((t.getDay() - 4 + 7) % 7) || 7; t.setDate(t.getDate() - back); return iso(new Date(t.getTime() - t.getTimezoneOffset() * 6e4)); })();
  const isNew = (d) => !!d.first_seen && d.first_seen >= LAST_MEETING;
  const inMkt = (m) => { const cur = WB.getMarket(); return cur === 'all' || m === cur; };
  const place = (d) => (d.uw && (d.uw.where || d.uw.submarket)) || (d.address || '').split(',').slice(-2, -1)[0]?.trim() || '';
  const words = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve'];
  const W = (n, cap) => { const w = n <= 12 ? words[n] : String(n); return cap ? w : w.toLowerCase(); };
  const list = (xs) => xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];
  const parceled = new Set(links.map((l) => l.deal_id));

  $('#date').textContent = today.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  $('#mkt').appendChild(WB.marketToggle());

  const row = (d) => {
    const g = M(d.guidance), u = M(d.units), sub = place(d);
    return `<a class="rw" href="pipeline/?deal=${d.id}"><span><b>${esc(d.name)}</b>${isNew(d) ? '<span class="new">New</span>' : ''}${sub ? `<small>${esc(sub)}</small>` : ''}</span>`
      + `<span class="n">${u ? u.toLocaleString('en-US') + ' units' : d.acres ? (+d.acres).toFixed(1) + ' ac' : '<span class="dim">–</span>'}</span>`
      + `<span class="n">${g ? usdM(g) : '<span class="dim">Unpriced</span>'}</span><span class="t">${d.kind === 'land' ? 'Dev' : 'Inv'}</span></a>`;
  };
  const byMarket = (ds) => WB.markets.filter((m) => inMkt(m.id)).map((m) => {
    const xs = ds.filter((d) => d.market_id === m.id).sort((a, b) => (isNew(b) - isNew(a)) || (a.kind === b.kind ? 0 : a.kind === 'land' ? -1 : 1) || a.name.localeCompare(b.name));
    return xs.length ? (WB.getMarket() === 'all' ? `<p class="grp">${esc(m.short)}</p>` : '') + xs.map(row).join('') : '';
  }).join('');

  function render() {
    const act = deals.filter((d) => ACTIVE.includes(d.stage) && inMkt(d.market_id));
    const uw = act.filter((d) => UWS.includes(d.stage)), sc = act.filter((d) => d.stage === 'screening');
    const dev = uw.filter((d) => d.kind === 'land').length, inv = uw.length - dev;
    const nw = act.filter(isNew);
    let h = `${W(dev, true)} development ${dev === 1 ? 'deal' : 'deals'} and ${W(inv)} ${inv === 1 ? 'acquisition' : 'acquisitions'} in underwriting.`;
    if (nw.length) h += nw.length <= 3 ? ` ${list(nw.map((d) => d.name))} ${nw.length === 1 ? 'is' : 'are'} new.` : ` ${W(nw.length, true)} new since ${mon(LAST_MEETING)}.`;
    else h += ` Nothing new since ${mon(LAST_MEETING)}.`;
    $('#headline').textContent = h;
    $('#uw').innerHTML = byMarket(uw) || '<div class="none">Nothing in underwriting.</div>';
    $('#sc').innerHTML = byMarket(sc) || '<div class="none">Nothing in screening.</div>';
    $('#scn').textContent = sc.length ? `${sc.length} ${sc.length === 1 ? 'deal' : 'deals'}` : '';

    // sale comp volume: this year to date vs the same stretch last year
    $('#vol').innerHTML = WB.markets.filter((m) => inMkt(m.id)).map((m) => {
      const cs = comps.filter((c) => c.market_id === m.id && c.sale_date && M(c.sale_price));
      const sum = (f) => cs.filter(f).reduce((t, c) => t + +c.sale_price, 0);
      const ytd = sum((c) => c.sale_date >= jan1), ly = sum((c) => c.sale_date >= lyJan1 && c.sale_date <= lySame), lyAll = sum((c) => c.sale_date >= lyJan1 && c.sale_date < jan1);
      const n = cs.filter((c) => c.sale_date >= jan1).length;
      const ch = ly ? (ytd / ly - 1) * 100 : null;
      return `<div class="fig2"><p class="l">${esc(m.short)}, ${n} ${n === 1 ? 'sale' : 'sales'} year to date</p><p class="v">${ytd ? usdM(ytd) : '$0'}</p>`
        + `<p class="s">${ch == null ? 'No sales by this date last year' : `${ch >= 0 ? 'Up' : 'Down'} ${Math.abs(ch).toFixed(0)}% from ${usdM(ly)} this time last year`}${lyAll ? `, ${usdM(lyAll)} for all of ${Y - 1}` : ''}</p></div>`;
    }).join('');

    // coming up
    const up = [...deals.filter((d) => inMkt(d.market_id) && d.bid_date && d.bid_date >= todayIso && d.bid_date <= in30 && ACTIVE.concat('monitor', 'prospect').includes(d.stage)).map((d) => ({ d, when: d.bid_date, what: 'Call for offers' })),
      ...deals.filter((d) => inMkt(d.market_id) && d.check_back_on && d.check_back_on <= in30).map((d) => ({ d, when: d.check_back_on, what: 'Check back' }))]
      .sort((a, b) => a.when.localeCompare(b.when));
    $('#upcoming').innerHTML = up.length ? up.slice(0, 6).map(({ d, when, what }) => `<a class="li" href="pipeline/?deal=${d.id}"><span>${esc(d.name)} <span style="color:var(--muted)">${what.toLowerCase()}</span></span><span class="c ${when <= todayIso ? 'due' : ''}">${mon(when)}</span></a>`).join('')
      : '<div class="none">No offer dates or check-backs in the next 30 days.</div>';

    // needs attention: counts that link to where you fix them, then any open review items
    const actM = deals.filter((d) => inMkt(d.market_id) && ACTIVE.includes(d.stage));
    const items = [
      ['Active deals without a parcel outline', actM.filter((d) => !parceled.has(d.id)).length, 'pipeline/?attn=parcel'],
      ['Active deals with no location', actM.filter((d) => d.lat == null).length, 'pipeline/?attn=location'],
      ['Development deals in underwriting with no CFO date', actM.filter((d) => d.kind === 'land' && UWS.includes(d.stage) && !d.bid_date).length, 'pipeline/?attn=cfo'],
      ['Active deals with no broker', actM.filter((d) => !d.broker).length, 'pipeline/?attn=broker'],
      ['Sale comps missing a location', noLoc, 'comps/?attn=location'],
    ].filter((x) => x[1]);
    $('#attn').innerHTML = (items.map(([l, n, href]) => `<a class="li" href="${href}"><span>${l}</span><span class="c">${n}</span></a>`).join('')
      + review.map((r) => `<div class="rq" data-id="${r.id}">${esc(r.reason)}<div class="acts">
        ${/duplicate/i.test(r.reason) ? '<button class="btn" data-act="merged">Same deal, merge</button><button class="btn" data-act="kept_separate">Keep separate</button>' : '<button class="btn" data-act="fixed">Done</button>'}
        <button class="btn" data-act="dismissed">Dismiss</button></div></div>`).join(''))
      || '<div class="none">Nothing to clean up.</div>';
  }
  window.addEventListener('wb:market', render);
  render();

  $('#attn').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = +b.closest('.rq').dataset.id, r = review.find((x) => x.id === id);
    if (b.dataset.act === 'merged' && r.kind === 'deal' && Array.isArray(r.record_ids) && r.record_ids.length === 2) {
      const { error: mErr } = await sb.schema('pipeline').rpc('merge_deals', { p_keep: r.record_ids[0], p_drop: r.record_ids[1] });
      if (mErr && !/already-merged/.test(mErr.message)) return WB.toast(mErr.message);
    }
    const { error } = await sb.schema('core').from('review_queue').update({ status: b.dataset.act, resolution: `Marked ${b.dataset.act.replace('_', ' ')} by ${user.email}` }).eq('id', id);
    if (error) return WB.toast(error.message);
    review.splice(review.findIndex((x) => x.id === id), 1); render(); WB.toast('Saved');
  });
})();
</script>
</body>
</html>
